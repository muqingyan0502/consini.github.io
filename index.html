function tgRefreshPlayBtn(){const is=audioEl&&!audioEl.paused;const play=`<svg viewBox="0 0 24 24" fill="currentColor">${is?'<path d="M7 5h4v14H7zM13 5h4v14h4V5z"/>':'<path d="M8 5l11 7-11 7z"/>'}</svg>`;const b1=$('#tgPlay'),b2=$('#tfPlay');if(b1)b1.innerHTML=play;if(b2)b2.innerHTML=play;}
function tgStep(dir){
  const t=state.together;if(!t)return;
  const list=currentSongs();
  if(!list.length){if(audioEl){audioEl.currentTime=0;audioEl.play();tgSyncState();}return;}
  const mode=t.mode||'list';
  if(mode==='shuffle'){const s=list[Math.floor(Math.random()*list.length)];state.together.song=s;loadTogetherSong(s,true);return;}
  const idx=list.findIndex(m=>m.id===t.song.id);
  const s=list[(idx+dir+list.length)%list.length];
  state.together.song=s;loadTogetherSong(s,true);
}
function tgEnded(){
  const t=state.together;if(!t)return;
  const mode=t.mode||'list';const list=currentSongs();
  if(mode==='single'){if(audioEl){audioEl.currentTime=0;audioEl.play();}tgSyncState();return;}
  if(mode==='shuffle'&&list.length){const s=list[Math.floor(Math.random()*list.length)];state.together.song=s;loadTogetherSong(s,true);return;}
  tgStep(1);
}

function startOutCall(){
  const s=sessionOf(state.activeSessionId);if(!s||s.type!=='dm')return toast('语音通话仅私聊');
  const c=contactById(s.contactId);const au=avatarURL(c);
  callState='dialing';callSeconds=0;
  const sc=$('#callScreen');sc.classList.add('on');
  sc.innerHTML=callScreenHTML(au,c.nickname,'正在呼叫…',`<button class="call-btn hangup" onclick="cancelOutCall()">${hangupIcon}</button>`);
  // 三种结果分开：接听 / 对方已拒绝 / 无应答
  const r=RND.int(0,2);
  setTimeout(()=>{
    if(callState!=='dialing')return;
    if(r===0){acceptCall(au,c.nickname);}
    else if(r===1){endCall('对方已拒绝',false);}
    else{endCall('无应答',false);}
  },2500);
}
function cancelOutCall(){endCall('已取消拨打',false);}

    <div class="call-timer" id="callTimer">${callSeconds?'00:00':''}</div></div>
    <div class="call-actions">

// 用时间戳计时：切后台/锁屏时 setInterval 会被浏览器暂停，但 Date.now() 差值真实无误，回来立即补上
function refreshCallClock(){
  if(callState!=='incall'||!callStartTs)return;
  callSeconds=Math.max(0,Math.floor((Date.now()-callStartTs)/1000));
  const el=$('#callTimer');if(el)el.textContent=fmtDur(callSeconds);
  const fl=$('#callFloatTime');if(fl)fl.textContent=fmtDur(callSeconds);
}
function startClock(){callStartTs=Date.now();refreshCallClock();callTimer=setInterval(refreshCallClock,1000);}
function stopClock(){clearInterval(callTimer);callTimer=null;callStartTs=0;}
// 从后台/锁屏回到前台时，立即刷新一次通话时长，不用等下一秒
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCallClock();});
let callMuted=false;
function muteToggle(){
  callMuted=!callMuted;
  const btn=$('#callMuteBtn');if(btn)btn.innerHTML=callMuted?mutedIcon:ghostIcon;
  const st=$('#callStatus');if(st)st.textContent=callMuted?'已静音':'通话中';
  toast(callMuted?'已静音':'已取消静音');
}

function callMin(){
  const sc=$('#callScreen');sc.classList.remove('on');
  const s=sessionOf(state.activeSessionId);const c=s?.contactId?contactById(s.contactId):null;
  const au=c?avatarURL(c):null;const name=c?.nickname||'对方';
  const fl=$('#callFloat');fl.style.display='flex';fl.style.left='50%';fl.style.bottom='110px';fl.style.top='auto';fl.style.transform='translateX(-50%)';
  fl.innerHTML=`<div style="width:34px;height:34px;border-radius:50%;overflow:hidden;background:#7E6B9D;display:flex;align-items:center;justify-content:center;font-size:calc(14px * var(--fscale));color:#fff">${au?`<img src="${au}" style="width:100%;height:100%;object-fit:cover">`:esc(name[0])}</div>

    <button class="cf-btn" onclick="callExpand()" title="放大" style="background:rgba(255,255,255,.24)">${expandIcon}</button>
    <button class="cf-btn" onclick="hangup()" title="挂断" style="background:var(--danger)">${hangupIcon}</button>`;
  makeFloatDraggable(fl);
}
function makeFloatDraggable(fl){
  if(!fl||fl.dataset.drag)return;fl.dataset.drag=1;
  let sx=0,sy=0,ox=0,oy=0,moving=false;
  const down=e=>{
    if(e.target.closest('.cf-btn'))return;
    const t=e.touches?e.touches[0]:e;
    sx=t.clientX;sy=t.clientY;
    const r=fl.getBoundingClientRect();ox=r.left;oy=r.top;moving=false;
    const move=ev=>{const q=ev.touches?ev.touches[0]:ev;const dx=q.clientX-sx,dy=q.clientY-sy;
      if(!moving&&Math.abs(dx)<6&&Math.abs(dy)<6)return;moving=true;
      fl.style.left=(ox+dx)+'px';fl.style.top=(oy+dy)+'px';fl.style.bottom='auto';fl.style.transform='none';};
    const up=()=>{window.removeEventListener('touchmove',move);window.removeEventListener('mousemove',move);
      window.removeEventListener('touchend',up);window.removeEventListener('mouseup',up);};
    window.addEventListener('touchmove',move,{passive:false});window.addEventListener('mousemove',move);
    window.addEventListener('touchend',up);window.addEventListener('mouseup',up);
  };
  fl.addEventListener('touchstart',down,{passive:false});fl.addEventListener('mousedown',down);
}
function callExpand(){const fl=$('#callFloat');fl.style.display='none';const sc=$('#callScreen');sc.classList.add('on');}
async function endCall(result,saved){
  // 结束瞬间按时间戳取真实时长（含后台/锁屏期间），再停止计时
  if(callStartTs)callSeconds=Math.max(0,Math.floor((Date.now()-callStartTs)/1000));
  stopClock();callState='idle';callMuted=false;
  const s=sessionOf(state.activeSessionId);
  if(s&&(saved||result==='通话结束')){
    await dbPut('callRecords',{id:uid(),direction:'out',contactId:s?.contactId,result,duration:callSeconds?fmtDur(callSeconds):'0:00',createdAt:nowStr(),sessionId:s?.id});
    state.callRecords=await dbAll('callRecords');
    await persistMessage({sessionId:s.id,sender:'me',type:'call',meta:{result,duration:callSeconds?fmtDur(callSeconds):'0:00'},recalled:false});
  }
  const fl=$('#callFloat');if(fl)fl.style.display='none';
  $('#callScreen').classList.remove('on');$('#callScreen').innerHTML='';
  if(state.route==='chat'&&state.activeSessionId)renderChat(state.activeSessionId);
  toast(result);
}

function periodShortLabel(){const c=state.periodConfig;if(!c||!c.lastStart)return'未设置';const cyc=Math.max(20,c.cycle||28),ln=Math.max(1,c.len||5);const d=new Date(),t=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const pos=((Math.floor((new Date(t+'T00:00:00')-new Date(c.lastStart+'T00:00:00'))/86400000)%cyc)+cyc)%cyc;const ovuDay=cyc-14;if(pos<ln)return`月经第 ${pos+1} 天`;if(pos>=ovuDay-3&&pos<=ovuDay+3)return'排卵期';return'安全期';}
function pAddDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function pToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
async function loadPeriod(){state.periodConfig=await dbGet('periodConfig','pc1');if(!state.periodConfig){state.periodConfig={cycle:28,len:5,lastStart:null};await dbPut('periodConfig',{...state.periodConfig,id:'pc1'});}state.periodLogs=await dbAll('periodLogs');}
function periodPhase(){
  const cfg=state.periodConfig||{cycle:28,len:5,lastStart:null};const t=pToday();
  if(!cfg.lastStart)return{noData:true,cfg};
  const cyc=Math.max(20,cfg.cycle||28),ln=Math.max(1,cfg.len||5);
  const pos=((Math.floor((new Date(t+'T00:00:00')-new Date(cfg.lastStart+'T00:00:00'))/86400000)%cyc)+cyc)%cyc;
  const ovuDay=cyc-14;const daysToNext=cyc-pos;const distOvu=pos-ovuDay;
  let phase,phaseColor;
  if(pos<ln){phase=`月经第 ${pos+1} 天`;phaseColor='#E95A78';}
  else if(pos>=ovuDay-3&&pos<=ovuDay+3){phase='排卵期';phaseColor='#C88FB0';}
  else {phase='安全期';phaseColor='#7FA0C9';}
  return {cfg,cyc,ln,pos,ovuDay,daysToNext,distOvu,phase,phaseColor,t};
}
function pCellClass(dateStr){
  const cfg=state.periodConfig;if(!cfg||!cfg.lastStart)return'';
  const cyc=Math.max(20,cfg.cycle||28),ln=Math.max(1,cfg.len||5),ovuDay=cyc-14;
  const diff=Math.floor((new Date(dateStr+'T00:00:00')-new Date(cfg.lastStart+'T00:00:00'))/86400000);
  const k=Math.floor(diff/cyc);const p=((diff%cyc)+cyc)%cyc;
  if(p<ln)return k===0?'p-actual':'p-predict';
  if(p>=ovuDay-3&&p<=ovuDay+3)return'p-ovu';
  return'';
}

function pMonthOf(offset){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+offset);return {y:d.getFullYear(),m:d.getMonth()};}
async function setPeriodStart(ds){
  const c={...state.periodConfig,id:'pc1',lastStart:ds,updatedAt:nowStr()};state.periodConfig=c;await dbPut('periodConfig',c);
  const ln=Math.max(1,c.len||5);
  for(let i=0;i<ln;i++){const d=pAddDays(ds,i);let l=periodLogsByDate(d);if(!l){l={id:uid(),date:d};await dbPut('periodLogs',l);}l.arrived='是';await dbPut('periodLogs',l);}
  state.periodLogs=await dbAll('periodLogs');renderPeriod();
}
async function clearPeriodStart(ds){
  const c=state.periodConfig;if(!c||c.lastStart!==ds){return;}
  c.lastStart=null;state.periodConfig=c;await dbPut('periodConfig',c);
  const ln=Math.max(1,c.len||5);
  for(let i=0;i<ln;i++){const d=pAddDays(ds,i);const l=periodLogsByDate(d);if(l){delete l.arrived;await dbPut('periodLogs',l);}}
  state.periodLogs=await dbAll('periodLogs');renderPeriod();
}

function drawWheel(cv,angle){
  const ctx=cv.getContext('2d');
  const foods=spinFoodPool();const n=foods.length;
  const cx=cv.width/2,cy=cv.height/2;
  const outer=cv.width/2-4,ring=16;
  const seg=2*Math.PI/n;
  ctx.clearRect(0,0,cv.width,cv.height);
  // 外环（深色金属边框）
  ctx.beginPath();ctx.arc(cx,cy,outer,0,2*Math.PI);
  ctx.fillStyle='#4A4038';ctx.fill();
  // 外环灯饰小圆点（真实转盘感）
  const lightR=outer-ring/2;
  for(let i=0;i<n*2;i++){
    const a=-Math.PI/2+i*(2*Math.PI/(n*2));
    ctx.beginPath();ctx.arc(cx+Math.cos(a)*lightR,cy+Math.sin(a)*lightR,3.4,0,2*Math.PI);
    ctx.fillStyle='#E9D9A6';ctx.fill();
  }
  // 扇区（柔和均衡浅色 + 白线分隔）
  const r=outer-ring-2;
  for(let i=0;i<n;i++){
    const a0=angle+i*seg,a1=a0+seg;
    const base=spinColors[i%spinColors.length];
    const g=ctx.createRadialGradient(cx,cy,r*0.3,cx,cy,r);
    g.addColorStop(0,base);
    g.addColorStop(1,base);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=2;ctx.stroke();
    // 食物名（深色，沿径向）
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a0+seg/2);ctx.textAlign='right';ctx.fillStyle='#4A3B30';
    const fs=n>10?24:(n>8?26:28);ctx.font=`bold ${fs}px sans-serif`;
    ctx.fillText(foods[i],r-18,9);ctx.restore();
  }
  // 中心圆钮
  ctx.beginPath();ctx.arc(cx,cy,38,0,2*Math.PI);ctx.fillStyle='#FFF8EE';ctx.fill();
  ctx.strokeStyle='#4A4038';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#D23A2E';ctx.textAlign='center';ctx.font='bold 34px sans-serif';ctx.fillText('GO',cx,cy+12);
}
function spinCanvasTap(e){
  if(spinRaf)return toast('转盘转动中，稍等片刻');
  const cv=$('#spinWheel');if(!cv)return;
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left-rect.width/2)/rect.width*cv.width;
  const y=(e.clientY-rect.top-rect.height/2)/rect.height*cv.height;
  const dist=Math.hypot(x,y);
  const foods=spinFoodPool();const n=foods.length;
  if(dist>cv.width/2-20||dist<40)return;
  const rel=((Math.atan2(y,x)-spinAngle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  const idx=Math.floor(rel/(2*Math.PI/n))%n;
  editSpinFood(idx);
}
function editSpinFood(idx){
  const w=waimaiState();const foods=spinFoodPool();
  if(idx<0||idx>=foods.length)return;
  const old=foods[idx];
  showDialog(`<h3>修改扇区食物</h3><div class="field"><label>新的名称</label><input type="text" id="spinEdit" value="${esc(old)}" maxlength="8"></div><div class="row" style="gap:8px;margin:2px 0"><button class="btn-danger btn-sm" onclick="spinRemoveCust(${idx})">删除这个食物</button></div><p class="muted" style="font-size:calc(11px * var(--fscale))">改动后会立即更新到转盘上</p>`,'保存',async()=>{
    const v=$('#spinEdit').value.trim();if(!v)return toast('不能为空');
    if(v===old){closeDialog();return;}
    const w2=waimaiState();
    if(!w2.spinList||!w2.spinList.length)w2.spinList=spinFoodPool().slice();
    if(w2.spinList.includes(v))return toast('已经有这个食物了');
    w2.spinList[idx]=v;
    await saveWaimai(w2);closeDialog();renderWaimaiSpin(state.shopCid);toast('已修改');
  });
}
function spinWheel(byTa){
  if(spinRaf)return;
  const cv=$('#spinWheel');if(!cv)return;
  const foods=spinFoodPool();const n=foods.length;const seg=2*Math.PI/n;
  const idx=RND.int(0,n-1);
  const base=(-Math.PI/2 - idx*seg - seg/2 + 2*Math.PI)%(2*Math.PI);
  const curMod=((spinAngle%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  const delta=((base-curMod)+2*Math.PI)%(2*Math.PI);
  const target=spinAngle+RND.int(5,8)*2*Math.PI+delta;
  const start=performance.now(),dur=2800,from=spinAngle;
  const el=$('#spinResult');if(el)el.innerHTML='';
  function step(t){
    const p=Math.min(1,(t-start)/dur);
    const e=1-Math.pow(1-p,3);
    spinAngle=from+(target-from)*e;
    drawWheel(cv,spinAngle);
    if(p<1)spinRaf=requestAnimationFrame(step);
    else{spinRaf=0;spinResult(foods[idx],byTa);}
  }
  spinRaf=requestAnimationFrame(step);
}

async function maybeAutoReply(sid, lastMsg){
  const s=sessionOf(sid);if(!s||s.type!=='dm')return;
  const cfg=await getCfg('reply_'+s.contactId,await getCfg('reply_global',{on:true}));
  if(RND.byProb(cfg.readNoReply))return; // 已读不回

  // === 只有你发拍一拍时，TA才可能单独回一条拍一拍（随机延迟、随机文案，绝不混进普通回复） ===
  if(lastMsg && lastMsg.type==='poke'){
    const pokePool=state.poke.filter(p=>p.direction==='them2me'&&p.contactId===s.contactId);
    const fallback=['笑着拍了拍你的手背','反手拍了拍你的胳膊','悄悄拍了拍你的肩膀','回拍了拍你的脑袋'];
    const texts=pokePool.length?pokePool.map(p=>p.text):fallback;
    // 不一定回：只有约3%概率主动拍回来，其余时候当作没看到，拍一拍是稀有事件
    if(!RND.byProb(3))return;
    // 随机延迟8~20秒，模仿真实"看到再拍"的反应节奏，不让我拍完立马就回
    setTimeout(async()=>{
      const picked=texts[Math.floor(Math.random()*texts.length)];
      await persistMessage({sessionId:sid,sender:'them',type:'poke',content:replaceNick(picked,s.contactId),recalled:false});
      s.lastMsg='拍了拍';s.lastTime=nowStr();await upsertSession(s);
      if(state.route==='chat'&&state.activeSessionId===sid)appendNewMsgs(sid);
    },RND.intInclusive(8000,20000));
    return;
  }

  const unitMs={秒:1000,分钟:60000,小时:3600000}[cfg.unit||'分钟'];
  const delay=RND.intInclusive(cfg.min||1,cfg.max||3)*unitMs;
  const typingText=(cfg.typing||'').trim()||'对方正在输入';
  // === 回复排队：每条消息都有回应（每次按设置的条数回），回复之间按 min~max 间隔依次发出，不密集连发、不合并 ===
  state.arQueue=state.arQueue||{};state.arTimers=state.arTimers||{};
  state.arQueue[sid]=(state.arQueue[sid]||0)+1;
  if(state.arTimers[sid])return; // 队列已在跑，本条消息已入队排队等回复
  const fire=async()=>{
    state.arTimers[sid]=null;
    const ratio=await getCfg('replyRatio_'+s.contactId,await getCfg('replyRatio_global',{sticker:40,wordcard:60}));
    const n=RND.sampleCount(cfg.cMin||1,cfg.cMax||2);
    const pool=await cardPool(s.contactId);
    const spool=state.stickers.filter(x=>x.owner==='dream'&&x.contactId===s.contactId);
    const hasStk=spool.length>0,hasWc=pool.length>0;
    let sent=false;
    // 3% 概率TA主动拍你（低频、自然，不会弹屏）
    const pokePool=state.poke.filter(p=>p.direction==='them2me'&&p.contactId===s.contactId);
    const sendPoke=async()=>{
      const fallback=['笑着拍了拍你的手背','反手拍了拍你的胳膊','悄悄拍了拍你的肩膀','回拍了拍你的脑袋'];
      const texts=pokePool.length?pokePool.map(p=>p.text):fallback;
      const picked=texts[Math.floor(Math.random()*texts.length)];
      await persistMessage({sessionId:sid,sender:'them',type:'poke',content:replaceNick(picked,s.contactId),recalled:false});
      s.lastMsg='拍了拍';
    };
    const sendStk=async()=>{for(const sp of RND.sampleWithout(spool,Math.min(n,spool.length))){await persistMessage({sessionId:sid,sender:'them',type:'sticker',content:sp.dataUrl,recalled:false});}s.lastMsg='[表情包]';};
    const sendWc=async()=>{for(const p of RND.sampleWithout(pool,Math.min(n,pool.length))){await persistMessage({sessionId:sid,sender:'them',type:'wordcard',meta:{cards:[{id:p.id,text:p.text}]},recalled:false});}};
    if(RND.byProb(3)){ // 3% 概率TA主动拍你一下
      await sendPoke();sent=true;
    } else if(RND.byProb(5)){ // 5% 概率发红包（内置）
      await sendThemRedPacket(s,sid);
      sent=true;
    } else if(hasStk&&hasWc){ // 都有：按占比二选一，默认偏向字卡
      if(RND.byProb(ratio.sticker??40)){await sendStk();}else{await sendWc();}
      sent=true;
    } else if(hasWc){await sendWc();sent=true;}
    else if(hasStk){await sendStk();sent=true;}
    hideTyping(sid);
    if(sent){s.lastTime=nowStr();await upsertSession(s);if(state.route==='chat'&&state.activeSessionId===sid)appendNewMsgs(sid);}
    state.arQueue[sid]=Math.max(0,(state.arQueue[sid]||0)-1);
    if(state.arQueue[sid]>0){
      // 队列还有下一条：再过 min~max 随机间隔继续回，每条都满足最短等待
      state.arTimers[sid]=setTimeout(fire,RND.intInclusive(cfg.min||1,cfg.max||3)*unitMs);
      showTyping(sid,typingText);
    }
  };
  showTyping(sid,typingText);
  state.arTimers[sid]=setTimeout(fire,delay);
}

/* 主动消息调度：页面存活期间按联系人独立计时；异常不会中断其他联系人的调度 */
let _proactiveSchedulerBusy=false;
setInterval(async()=>{
  if(!db||_proactiveSchedulerBusy)return;
  _proactiveSchedulerBusy=true;
  try{
    const g=await getCfg('active_global',null);
    // 全局开关一旦设置为关闭，就按界面约定暂停所有联系人的主动消息。
    if(g && g.on===false)return;
    const contacts=[...state.contacts];
    for(const c of contacts){
      try{
        const cfg=await getCfg('active_'+c.id,null);if(!cfg||!cfg.on)continue;
        const now=Date.now();
        const unitMs={秒:1000,分钟:60000,小时:3600000}[cfg.unit]||60000;
        const interval=Math.max(1,Number(cfg.interval)||30)*unitMs;
        if(!cfg.nextRun){cfg.nextRun=now+interval;await setCfg('active_'+c.id,cfg);continue;}
        if(Number(cfg.nextRun)>now)continue;
        const pool=await cardPool(c.id);
        if(pool.length){
          const sess=await ensureDMSession(c.id);
          const min=Math.max(1,Number(cfg.cMin)||1),max=Math.max(min,Number(cfg.cMax)||min);
          const n=Math.min(pool.length,RND.sampleCount(min,max));
          const picked=RND.sampleWithout(pool,n);
          for(const p of picked)await persistMessage({sessionId:sess.id,sender:'them',type:'wordcard',meta:{cards:[{id:p.id,text:p.text}]},recalled:false});
          if(state.route==='chat'&&state.activeSessionId===sess.id)await renderChat(sess.id);
          else if(state.route==='messages')await renderMessages();
        }
        // 即使字卡库为空也推进下次检查，避免每 5 秒反复尝试；不会凭空生成内容。
        cfg.nextRun=now+interval;await setCfg('active_'+c.id,cfg);
      }catch(contactErr){console.warn('联系人主动发消息失败：'+(c.nickname||c.name||c.id),contactErr);}
    }
  }catch(err){console.warn('主动发消息调度失败',err);}
  finally{_proactiveSchedulerBusy=false;}
},5000);
/* 离线补发：记录上次上线时间，重开后按“主动发消息”频率补发离线期间的来信，显示未读 */
function fmtDt(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}
async function doOfflineCatchUp(){
  if(!db)return;
  const now=Date.now();
  const ls=Number(localStorage.getItem('dm_lastseen'))||now;
  const offlineMs=Math.max(0,now-ls);
  if(offlineMs<10*1000){localStorage.setItem('dm_lastseen',String(now));return;}
  const g=await getCfg('active_global',null);
  // 全局开关关闭时不补发，但仍结算时间，避免以后打开开关时把关闭期间也补出来。
  if(g&&!g.on){localStorage.setItem('dm_lastseen',String(now));return;}
  // 只在所有联系人均处理成功后更新 lastseen；中途异常时下次可以重试，不会悄悄丢掉整段离线时间。
  for(const c of state.contacts){
    const cfg=await getCfg('active_'+c.id,null);
    if(!cfg||!cfg.on)continue;
    const unitMs=({秒:1000,分钟:60000,小时:3600000})[cfg.unit]||60000;
    const interval=Math.max(1,Number(cfg.interval)||30)*unitMs;
    const rounds=Math.floor(offlineMs/interval);
    if(rounds<=0)continue;
    const pool=await cardPool(c.id);
    if(!pool.length)continue; // 没有可用字卡时保留原逻辑：不凭空生成消息
    const cap=300;
    const n=Math.min(rounds,cap);
    const sess=await ensureDMSession(c.id);
    // 每轮对应一个真实的计划时间点：离线 30 分钟、间隔 5 分钟，即第 5/10/15/20/25/30 分钟各一轮。
    for(let i=1;i<=n;i++){
      const cnt=Math.max(1,Math.min(pool.length,RND.sampleCount(Number(cfg.cMin)||1,Number(cfg.cMax)||1)));
      const picked=RND.sampleWithout(pool,cnt);
      const ts=ls+i*interval;
      for(const p of picked){
        await persistMessage({sessionId:sess.id,sender:'them',type:'wordcard',meta:{cards:[{id:p.id,text:p.text}]},recalled:false,time:fmtDt(ts)});
      }
    }
  }
  localStorage.setItem('dm_lastseen',String(now));
}
let _offlineCatchUpBusy=false;
async function safeOfflineCatchUp(){
  if(_offlineCatchUpBusy||!db)return;
  _offlineCatchUpBusy=true;
  try{
    await doOfflineCatchUp();
    await reloadAll();
    if(state.route==='chat'&&state.activeSessionId)renderChat(state.activeSessionId);
    else if(state.route==='messages')renderMessages();
    else render();
  }catch(e){console.warn('离线消息补发失败',e);}
  finally{_offlineCatchUpBusy=false;}
}

const MASK_PRESETS={frost:{c:'15,9,22',f:'blur(4px) saturate(.9)'},matte:{c:'60,55,70',f:'blur(6px) saturate(.6) brightness(.92)'},glossy:{c:'255,255,255',f:'blur(2px) brightness(1.25) saturate(1.4)'},grain:{c:'30,25,40',f:'blur(3px) contrast(1.06) saturate(.85)'},velvet:{c:'40,20,45',f:'blur(8px) saturate(.7) brightness(.85)'},glass:{c:'255,255,255',f:'blur(6px) brightness(1.12) saturate(1.18)'},crystal:{c:'150,120,230',f:'blur(5px) saturate(1.6) contrast(1.05) hue-rotate(8deg)'},dark:{c:'0,0,0',f:'blur(0px)'},fog:{c:'22,16,34',f:'blur(6px) saturate(.9)'},cool:{c:'24,44,72',f:'blur(4px) saturate(.75)'},warm:{c:'58,34,14',f:'blur(4px) saturate(1.1)'},night:{c:'0,0,0',f:'blur(3px)'},dreamy:{c:'255,240,255',f:'blur(14px) brightness(1.15)'},contrast:{c:'0,0,0',f:'contrast(1.45) saturate(.6)'},glow:{c:'255,220,180',f:'brightness(1.2) saturate(1.5) blur(3px)'},gradient:{g:'linear-gradient(180deg, rgba(22,15,40,.42) 0%, rgba(22,15,40,.14) 45%, rgba(22,15,40,0) 100%)',f:'blur(0)'}};

function maskVars(style,dim,clarity){if(style==='none')return{bg:'rgba(0,0,0,0)',filter:'none'};const b=MASK_PRESETS[style]||MASK_PRESETS.frost;const c=clarity==null?75:clarity;const blurPx=Math.round((100-c)/100*24);const f=injectBlur(b.f||'',blurPx);if(b.g)return{bg:b.g,filter:f};const a=Math.min(1,Math.max(0,(dim||30)/100));return {bg:`rgba(${b.c},${a})`,filter:f};}

/* 一键压缩媒体（表情包/聊天图片/朋友圈图片/背景）瘦身 */
function compressImageDataUrl(du,maxSide=640,q=0.82){
  return new Promise(res=>{
    if(typeof du!=='string'||!du.startsWith('data:image/'))return res(du);
    if(du.startsWith('data:image/gif'))return res(du); // 保留动图，避免丢失动画
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
      if(scale>=1&&du.length<60000){res(du);return;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const out=c.toDataURL('image/jpeg',q);
      res(out.length<du.length?out:du);
    };
    img.onerror=()=>res(du);
    img.src=du;
  });
}
async function compressMedia(){
  toast('正在压缩媒体…');
  let saved=0;
  // 表情包
  for(const s of state.stickers||[]){
    const nv=await compressImageDataUrl(s.dataUrl);
    if(nv!==s.dataUrl){s.dataUrl=nv;await dbPut('stickers',s);saved++;}
  }
  // 聊天图片/表情
  for(const m of await dbAll('messages')){
    if(typeof m.content==='string'&&m.content.startsWith('data:image/')){
      const nv=await compressImageDataUrl(m.content);
      if(nv!==m.content){m.content=nv;await dbPut('messages',m);saved++;}
    }
  }
  // 朋友圈图片
  for(const mo of await dbAll('moments')){
    if(mo.images&&mo.images.length){let ch=false;
      const imgs=await Promise.all(mo.images.map(async i=>{const nv=await compressImageDataUrl(i);if(nv!==i)ch=true;return nv;}));
      if(ch){mo.images=imgs;await dbPut('moments',mo);saved++;}
    }
  }
  // 背景
  const bg=state.config.backgrounds||{};
  for(const k of Object.keys(bg)){
    const nv=await compressImageDataUrl(bg[k]);
    if(nv!==bg[k]){bg[k]=nv;await setCfg('backgrounds',bg);state.config.backgrounds=bg;saved++;}
  }
  state.stickers=await dbAll('stickers');
  await computeStorage();renderBackup();
  toast(`压缩完成：${saved} 项已瘦身`);
}

async function exportBackup(){
  toast('正在导出…');
  try{
    const dump={version:3,exportedAt:nowStr(),stores:{}};
    for(const s of dbStores()){let rows=await dbAll(s);rows=await Promise.all(rows.map(async r=>{const o={...r};for(const k of Object.keys(o)){if(o[k] instanceof Blob)o[k]={__b64:true,data:await blobToDataURL(o[k])};}return o;}));dump.stores[s]=rows;}
    const json=JSON.stringify(dump);
    const n=Object.values(dump.stores).reduce((a,r)=>a+r.length,0);
    const blob=new Blob([json],{type:'application/json;charset=utf-8'});
    const fileName='cosini.json';
    // 支持保存选择器的浏览器：直接让你选文件夹（一般选“下载”）保存，最可靠
    if(window.showSaveFilePicker&&!/iPhone|iPad|Android|Mobile|via/i.test(navigator.userAgent)){
      try{
        const handle=await window.showSaveFilePicker({suggestedName:fileName,types:[{description:'JSON 备份',accept:{'application/json':['.json']}}]});
        const w=await handle.createWritable();await w.write(blob);await w.close();
        opLogAdd('导出了全部数据备份（'+n+' 条记录）');renderBackup();
        toast('已保存到 Download/'+fileName);
        return;
      }catch(e){if(e&&e.name==='AbortError'){toast('已取消保存');return;}/* 其它错误走下载兜底 */}
    }
    const u=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=u;a.download=fileName;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
    opLogAdd('导出了全部数据备份（'+n+' 条记录）');renderBackup();
    toast(`已导出 ${n} 条，文件在手机「下载」：${fileName}`);
  }catch(e){toast('导出失败：'+e.message);}
}
function importBackup(){
  showDialog(`<h3>导入恢复数据</h3>
    <div class="field"><label>选择备份 JSON 文件</label><input type="file" id="backupFile" accept=".json,application/json"></div>
    <div class="field"><label>或直接粘贴备份内容</label><textarea id="backupText" style="min-height:120px" placeholder="把导出的 JSON 粘贴到这里"></textarea></div>
    <p class="tiny">支持本应用导出的备份，也支持导入部分其他 App 的备份（自动适配转换）。导入将覆盖当前全部数据。</p>`,'开始导入',async()=>{
      const f=$('#backupFile')?.files[0];
      if(!f&&!($('#backupText')?.value||'').trim()){toast('请先选择备份文件，或粘贴备份内容');return;}
      let text='';
      if(f){try{text=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=()=>rej(new Error('读取失败'));rd.readAsText(f);});}catch(err){toast('读取文件失败：'+err.message);return;}}
      else text=($('#backupText')?.value||'').trim();
      try{
        let data=JSON.parse(text);
        if(!data.version||!data.stores){ // 尝试适配其他 App 备份格式
          const conv=convertAnBackup(data);
          if(conv)data=conv;
        }
        if(!data.version||!data.stores)throw new Error('格式不正确：缺少 version/stores');
        showConfirm('校验通过，导入将覆盖当前全部数据，确认继续？',async()=>{
          const stores=dbStores();
          for(const s of stores)await dbClear(s);
          for(const s of stores){for(const r of data.stores[s]||[]){for(const k of Object.keys(r)){if(r[k]&&r[k].__b64)r[k]=dataUrlToBlob(r[k].data);}await dbPut(s,r);}}
          await loadConfig();await reloadAll();opLogAdd('导入并恢复了全部数据');toast('导入完成');render();
        });
      }catch(err){toast('导入失败：'+err.message);}
    },true);
}
/* ============================================================
 * 适配导入：把其他 App 的备份（_an_version/idb 格式）转为本应用格式
 * ============================================================ */
function anFmtTime(ts){
  if(!ts)return nowStr();
  const n=Number(ts);if(!n||isNaN(n))return nowStr();
  const d=new Date(n),p=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function convertAnBackup(an){
  try{
    if(!an||!(an._an_version!=null||an.idb))return null;
    const stores={};for(const s of STORES)stores[s]=[];
    const idb=an.idb||{};
    // 我的资料 + 钱包
    const mp=idb.an_myProfile||{};
    const profile={nickname:mp.name||'我'};
    if(mp.face){profile.avatarBlob=mp.face;avStore('me',mp.face);}
    stores['config']=[{id:'global',profile,wallet:{balance:parseFloat(mp.balance)||0,txns:[]}}];
    // 联系人/会话/消息/字卡/表情包/背景
    const catIds={};let dmBg=null;
    for(const c of (idb.an_contacts||[])){
      const cid=c.id||uid();
      stores['contacts'].push({id:cid,nickname:c.name||'对方',createdAt:anFmtTime(c.id),...(c.face?{avatarBlob:c.face}:{})});if(c.face)avStore(cid,c.face);
      stores['sessions'].push({id:cid,type:'dm',contactId:cid,title:c.name||'对方',pinned:false,unread:c.unread||0,createdAt:anFmtTime(c.id)});
      for(const m of (c.messages||[])){
        const kind=m.kind||'text';let type,content;
        if(kind==='text'){type='text';content=m.body||'';}
        else if(kind==='image'){type='image';content=m.body||'';}
        else if(kind==='poke'){type='text';content='[拍一拍] '+(m.body||'');}
        else if(kind==='call'){type='text';content='[语音通话]';}
        else if(kind==='hongbao'){type='text';content='[红包] ¥'+(m.amount||'');}
        else {type='text';content=(m.body||'');}
        stores['messages'].push({id:m.id||uid(),sessionId:cid,sender:m.from==='me'?'me':'them',type,content,time:anFmtTime(m.ts),recalled:false});
      }
      for(const g of (c.groups||[])){
        let catId=catIds[cid+':'+g.name];
        if(!catId){catId=uid();catIds[cid+':'+g.name]=catId;stores['wordCardCats'].push({id:catId,name:g.name,scope:'contact',contactId:cid,createdAt:nowStr()});}
        for(const it of (g.items||[])){if(it&&it.text)stores['wordCards'].push({id:uid(),text:it.text,catId,scope:'contact',contactId:cid,createdAt:nowStr()});}
      }
      for(const mm of ((c.config&&c.config.contactMemes)||[]))stores['stickers'].push({id:mm.id||uid(),owner:'dream',contactId:cid,dataUrl:mm.src||mm.thumb||'',name:'',createdAt:nowStr()});
      if(!dmBg&&c.wallpaper)dmBg=c.wallpaper;
    }
    for(const mm of (idb.an_my_memes||[]))stores['stickers'].push({id:mm.id||uid(),owner:'me',dataUrl:mm.src||mm.thumb||'',name:'',createdAt:nowStr()});
    for(const p of (idb.an_pyq_posts||[]))stores['moments'].push({id:p.id||uid(),author:p.authorName&&p.authorName!=='我'?'them':'me',authorName:p.authorName||'对方',authorAvatar:p.authorAvatar||'',text:p.text||'',images:p.images||[],createdAt:anFmtTime(p.ts)});
    if(dmBg)stores['config'].push({id:'backgrounds',data:{dm:dmBg}});
    return {version:3,exportedAt:nowStr(),stores};
  }catch(e){return null;}
}
function openClearChatByDate(){
  const sid=state.activeSessionId;if(!sid)return toast('请先进入聊天');
  const list=msgsOf(sid);
  const dates=list.map(m=>m.time.slice(0,10)).filter(Boolean);
  const first=dates[0]||new Date().toISOString().slice(0,10);
  const today=new Date().toISOString().slice(0,10);
  showDialog(`<h3>清除聊天记录</h3>
    <div class="field"><label>开始日期</label><input type="date" id="ccStart" value="${first}"></div>
    <div class="field"><label>结束日期</label><input type="date" id="ccEnd" value="${today}"></div>
    <p class="tiny" id="ccCount"></p>
    <p class="tiny">仅删除该时间段内的消息，其余保留；会话与联系人不受影响。</p>`,'确认清除',async()=>{
    const a=$('#ccStart')?.value,b=$('#ccEnd')?.value;
    if(!a||!b||b<a)return toast('日期无效：结束日期需不早于开始日期');
    let n=0;
    for(const m of list){const d=m.time.slice(0,10);if(d>=a&&d<=b){await dbDel('messages',m.id);n++;}}
    state.messages=await dbAll('messages');
    const s=sessionOf(sid);if(s&&n){s.lastMsg='';s.lastTime='';await upsertSession(s);}
    opLogAdd('清除了「'+sessionTitle(s)+'」'+a+'~'+b+' 的 '+n+' 条消息');closeDialog();toast('已清除 '+n+' 条');renderChat(sid);
  },true);
  // 选择起止日期后实时统计该时间段内将清除的消息条数
  const upd=()=>{
    const a=$('#ccStart')?.value,b=$('#ccEnd')?.value,el=$('#ccCount');
    if(!el)return;
    if(!a||!b||b<a){el.textContent='日期无效：结束日期需不早于开始日期';el.style.color='var(--danger)';return;}
    let n=0;for(const m of list){const d=m.time.slice(0,10);if(d>=a&&d<=b)n++;}
    el.textContent=n?`本次将清除 ${n} 条消息`:'所选时间段内无消息';
    el.style.color=n?'':'var(--danger)';
  };
  const cs=$('#ccStart'),ce=$('#ccEnd');
  if(cs)cs.addEventListener('change',upd);
  if(ce)ce.addEventListener('change',upd);
  upd();
}

  <li>全屏语音通话：拨打后对方随机接听/拒绝、计时、挂断保存记录；无任何视频入口</li>

/* ============================================================
 * 启动初始化
 * ============================================================ */
async function reloadAll(){
  state.contacts=await dbAll('contacts');state.groups=await dbAll('groups');state.sessions=await dbAll('sessions');
  state.messages=await dbAll('messages');state.wordCards=await dbAll('wordCards');state.wordCardCats=await dbAll('wordCardCats');
  state.stickers=await dbAll('stickers');state.stickerCats=await dbAll('stickerCats');state.poke=await dbAll('pokeMsgs');
  state.greetings=await dbAll('greetings');state.redPackets=await dbAll('redPackets');state.moments=await dbAll('moments');
  state.likes=await dbAll('momentLikes');state.comments=await dbAll('momentComments');state.dilemmas=await dbAll('dilemmas');
  state.qBank=await dbAll('qBank');state.qRecords=await dbAll('qRecords');state.callRecords=await dbAll('callRecords');
  state.music=await dbAll('music');state.playlists=await dbAll('playlists');state.invitations=await dbAll('musicInvitations');
  state.letters=await dbAll('letters');state.diaries=await dbAll('diaries');
  state.kaomojis=await dbAll('kaomojis');
  state.config.backgrounds=await getCfg('backgrounds',{});
}
async function boot(){
  try{await openDB();}catch(e){VIEW.innerHTML='<div class="empty-state">当前浏览器不支持 IndexedDB，无法保存数据。</div>';return;}
  // 部分浏览器（如 Via）不预留状态栏，内容会顶到刘海/摄像头区域，给这类环境单独加顶部安全区
  if(/via/i.test(navigator.userAgent))document.documentElement.setAttribute('data-notch','1');
  await loadConfig();await reloadAll();await migrateAvatars();await doOfflineCatchUp();render();applyHomeBg();
  applyFscale(getFscale());
  // 重进自动恢复保活：开启过「自动保活」或上次开着保活（audioOn/wl）时，静默尝试恢复
  if(state.keepalive?.auto||state.keepalive?.audioOn||state.keepalive?.wl){keepaliveOn(true);}
}
boot();
</script>
