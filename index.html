<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>梦角聊天</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%239C8BB8'/%3E%3Cpath d='M7 10h10M7 14h6' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============ 设计变量（浅紫，禁纯黑/绿） ============ */
:root{
  --bg-page:#FAF8FB; --bg-secondary:#F2EEF6; --surface:#FFFFFF;
  --text-primary:#403A46; --text-secondary:#9A92A1; --text-muted:#C1B9C7;
  --accent:#9C8BB8; --accent-strong:#7E6B9D; --accent-soft:#E8DFF0;
  --border:#ECE5F0; --btn-sec-border:#DAD1E1;
  --toggle-on:#9C8BB8; --toggle-off:#E4DBE9;
  --danger:#C4685C; --danger-soft:#F5E4E1; --info-bg:#F1EAF3;
  --overlay:rgba(64,58,70,.32);
  --bubble-other:#FFFFFF; --bubble-self:#E8DFF0;
  --radius-card:16px; --radius-bubble:14px; --radius-btn:10px; --radius-input:12px;
  --shadow-soft:0 1px 3px rgba(64,58,70,.06),0 4px 12px rgba(64,58,70,.05);
  --nav-h:56px;
  --fscale:1;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:calc(15px * var(--fscale)); line-height:1.6; color:var(--text-primary);
}
[data-theme="dark"]{
  --bg-page:#221E28; --bg-secondary:#2C2734; --surface:#3A3444;
  --text-primary:#E9E2EF; --text-secondary:#B6ACBE; --text-muted:#8A8094;
  --accent:#B3A3CC; --accent-strong:#C4B5D9; --accent-soft:#4A4058;
  --border:#4A4254; --btn-sec-border:#5A5068;
  --toggle-off:#4A4254; --danger:#D48278; --danger-soft:#4A3532; --info-bg:#443C50;
  --bubble-other:#433B50; --bubble-self:#4E435F;
  --overlay:rgba(20,17,26,.6); --shadow-soft:0 1px 3px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg-secondary);color:var(--text-primary)}
/* 手机窄宽居中框架 */
#phone{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg-page);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(64,58,70,.08)}
/* 主页背景磨砂压暗遮罩：压暗+模糊，让文字清晰可读，保留背景质感（内容在遮罩之上）；颜色/滤镜用CSS变量动态调节 */
#phone.has-home-bg::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:var(--mask-bg, rgba(15,9,22,.30));backdrop-filter:var(--mask-filter, blur(6px) saturate(.85));-webkit-backdrop-filter:var(--mask-filter, blur(6px) saturate(.85))}
/* 背景质感选择按钮：选中态高亮 */
.ms-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(min-width:768px){#phone{min-height:94dvh;margin-top:3dvh;border-radius:24px;overflow:hidden}}

/* ============ 通用控件类（禁止全局 button） ============ */
.btn-main{height:40px;padding:0 20px;border:none;border-radius:var(--radius-btn);background:var(--accent);color:#fff;font-size:calc(15px * var(--fscale));font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-main:active{background:var(--accent-strong)}
.btn-sec{height:36px;padding:0 16px;border:1px solid var(--btn-sec-border);border-radius:var(--radius-btn);background:var(--surface);color:var(--text-primary);font-size:calc(14px * var(--fscale));cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-sec:active{background:var(--bg-secondary)}
.btn-danger{height:36px;padding:0 16px;border:1px solid var(--danger);border-radius:var(--radius-btn);background:var(--danger-soft);color:var(--danger);font-size:calc(14px * var(--fscale));cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-sm{height:32px;padding:0 12px;font-size:calc(13px * var(--fscale));border-radius:8px}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--text-primary);cursor:pointer;border-radius:12px}
.icon-btn svg{width:22px;height:22px}
.icon-btn:active{background:var(--bg-secondary)}
input[type=text],input[type=number],input[type=datetime-local],textarea,select{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-input);
  padding:10px 12px;font-size:calc(15px * var(--fscale));color:var(--text-primary);font-family:inherit;outline:none}
textarea{resize:vertical;min-height:96px}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.field{margin-bottom:16px}
.field label{display:block;font-size:calc(13px * var(--fscale));color:var(--text-secondary);margin-bottom:6px}
.row{display:flex;gap:12px;align-items:center}
.row>*{min-width:0}
.card{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-soft);padding:16px;margin-bottom:16px}
.muted{color:var(--text-secondary);font-size:calc(13px * var(--fscale))}
.tiny{font-size:calc(12px * var(--fscale));color:var(--text-muted)}
.empty-state{padding:48px 24px;text-align:center;color:var(--text-muted)}
.empty-state .icon-wrap{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.empty-state svg{width:30px;height:30px}

/* 顶栏 */
.topbar{height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0;box-sizing:border-box;display:flex;align-items:center;gap:4px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:0;z-index:20}
.topbar .title{flex:1;text-align:center;font-size:calc(17px * var(--fscale));font-weight:700;position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.topbar .spacer{flex:1}
#topRightSlot{display:flex;justify-content:flex-end;align-items:center}
.sub-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer}
.sub-back:active{background:var(--bg-secondary)}

/* 内容区 */
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;padding-bottom:calc(var(--nav-h) + 24px);position:relative;z-index:2}

/* 底部导航 */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:30}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#BDB6C6;cursor:pointer;transition:color .15s}
.nav-item svg{width:24px;height:24px}
.nav-item span{font-size:calc(10px * var(--fscale))}
.nav-item.active{color:var(--nav-c,#9C8BB8)}
.nav-item[data-nav="messages"]{--nav-c:#9C8BB8}
.nav-item[data-nav="contacts"]{--nav-c:#7FA0C9}
.nav-item[data-nav="discover"]{--nav-c:#C88FB0}
.nav-item[data-nav="me"]{--nav-c:#C0A57E}

/* 列表 */
.list-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);cursor:pointer;border-bottom:1px solid var(--border)}
.list-wrap.compact .list-row{padding:12px 14px;gap:12px}
.list-wrap.compact .list-row .name{font-size:calc(14.5px * var(--fscale))}
.tgswitch{width:44px;height:26px;border-radius:13px;background:#E4E0EA;position:relative;transition:.2s;flex:none}
.tgswitch.on{background:var(--accent)}
.tgswitch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tgswitch.on::after{left:21px}
.list-row:last-child{border-bottom:none}
.list-row.compact{padding:10px 14px;gap:10px}
.list-row.compact .list-main .name{font-size:calc(14px * var(--fscale))}
.list-wrap{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-soft);overflow:hidden;margin-bottom:16px}
.avatar{width:48px;height:48px;border-radius:8px;flex-shrink:0;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-strong);font-weight:700;font-size:calc(18px * var(--fscale));overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:36px;height:36px;font-size:calc(14px * var(--fscale))}
.list-main{flex:1;min-width:0}
.list-main .name{font-size:calc(15px * var(--fscale));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-main .sub{font-size:calc(12px * var(--fscale));color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:calc(11px * var(--fscale));display:flex;align-items:center;justify-content:center}
.pin-tag{font-size:calc(11px * var(--fscale));color:var(--accent-strong);background:var(--accent-soft);padding:1px 6px;border-radius:6px;margin-left:6px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:var(--overlay);z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px}
.dialog{background:var(--surface);border-radius:20px;width:88%;max-width:360px;padding:20px;animation:pop .14s ease}
/* iOS 聚焦输入框时若字号小于16px会自动放大整个弹窗，统一提到16px防止缩放 */
.dialog input,.dialog textarea,.dialog select{font-size:16px}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.dialog h3{font-size:calc(17px * var(--fscale));font-weight:700;margin-bottom:14px}
.dialog-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.dialog-actions:empty{display:none}
.dialog-actions .btn-main,.dialog-actions .btn-sec{min-width:88px}

/* 长按消息菜单 */
.ctx-menu{position:fixed;z-index:80;background:#3A342F;color:#fff;border-radius:14px;display:flex;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.ctx-menu button{background:transparent;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;cursor:pointer;font-size:calc(12px * var(--fscale));border-radius:10px}
.ctx-menu button:active{background:rgba(255,255,255,.12)}
.ctx-menu svg{width:20px;height:20px}

/* toast */
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#3A342F;color:#fff;padding:10px 18px;border-radius:12px;font-size:calc(14px * var(--fscale));z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80%;text-align:center}
#toast.show{opacity:1}

/* ============ 聊天页 ============ */
.chat-wrap{position:fixed;inset:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:0;z-index:40;background:var(--bg-page);overflow:hidden;overscroll-behavior:none}
.in-chat{overflow:hidden;height:100%}
.chat-head{height:calc(56px + env(safe-area-inset-top,0px));box-sizing:border-box;padding:env(safe-area-inset-top,0px) 8px 0;display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--border)}
[data-notch] .topbar{height:calc(56px + env(safe-area-inset-top,26px));padding:env(safe-area-inset-top,26px) 8px 0}
[data-notch] .chat-head{height:calc(56px + env(safe-area-inset-top,26px));padding:env(safe-area-inset-top,26px) 8px 0}
.chat-head .cname{flex:1;text-align:center;font-weight:700;font-size:calc(16px * var(--fscale));position:absolute;left:50%;transform:translateX(-50%)}
.typing-ind{position:absolute;left:50%;transform:translateX(-50%);bottom:3px;font-size:calc(12px * var(--fscale));color:var(--text-secondary);display:flex;align-items:center;white-space:nowrap;z-index:5;pointer-events:none}
.typing-ind.hidden{display:none}
.typing-ind .tdots{display:inline-flex;gap:3px;margin-left:4px}
.typing-ind .tdots i{width:4px;height:4px;border-radius:50%;background:var(--accent-strong);animation:tdot 1.1s infinite}
.typing-ind .tdots i:nth-child(2){animation-delay:.18s}
.typing-ind .tdots i:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
/* 居中标题里的“正在输入”三点 */
.cname.typing .tdots{display:inline-flex;gap:3px;margin-left:5px;vertical-align:middle}
.cname.typing .tdots i{width:5px;height:5px;border-radius:50%;background:var(--accent-strong);display:inline-block;font-style:normal;animation:tdot 1.1s infinite}
.cname.typing .tdots i:nth-child(2){animation-delay:.18s}
.cname.typing .tdots i:nth-child(3){animation-delay:.36s}
.chat-msgs{flex:1;min-height:0;height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 12px;display:flex;flex-direction:column;gap:14px}
.msg-row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg-row.self{flex-direction:row-reverse}
.msg-row .bubble,.msg-row .rp-card,.msg-row .dilem-card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bubble{max-width:72%;padding:10px 14px;border-radius:var(--radius-bubble);background:var(--bubble-other);box-shadow:var(--shadow-soft);font-size:calc(15px * var(--fscale));word-break:break-word;position:relative}
.msg-row.self .bubble{background:var(--bubble-self)}
/* 一起听歌分享卡：独立卡片，不套气泡 */
.music-share{display:flex;align-items:center;gap:10px;max-width:76%;padding:10px 12px;border-radius:12px;background:#FFFFFF;border:1px solid var(--border);box-shadow:var(--shadow-soft);cursor:pointer}
.music-share .ms-icon{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#67D689,#3FC46A);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.music-share .ms-tag{font-size:calc(12px * var(--fscale));color:var(--text-secondary)}
.music-share .ms-name{font-size:calc(14px * var(--fscale));font-weight:600;color:var(--text-primary);line-height:1.4}
.bubble .quoted{font-size:calc(12px * var(--fscale));color:var(--text-secondary);border-left:2px solid var(--accent);padding-left:8px;margin-bottom:6px;opacity:.85;white-space:pre-wrap}
.bubble img{max-width:120px !important;max-height:120px !important;width:auto !important;height:auto !important;border-radius:10px;display:block;object-fit:contain;cursor:zoom-in}
.msg-time{font-size:calc(11px * var(--fscale));color:var(--text-muted);align-self:center}
.msg-recalled{font-size:calc(12px * var(--fscale));color:var(--text-muted);text-align:center;padding:4px}
.pick-tag{font-size:calc(12px * var(--fscale));color:var(--accent-strong)}
/* 拍一拍：微信式居中透明系统提示，不带头像、不带气泡框 */
.msg-poke{text-align:center;color:var(--accent-strong);font-size:calc(12px * var(--fscale));padding:4px 0;line-height:1.5;user-select:none}
/* 红包卡片 */
.rp-card{width:200px;background:linear-gradient(160deg,#f7b06a,#ee6a53 52%,#d93636);color:#fff;border-radius:10px;padding:12px 14px;cursor:pointer;box-shadow:0 2px 10px rgba(217,54,54,.28)}
.rp-card .rp-amt{font-size:calc(24px * var(--fscale));font-weight:800;margin:4px 0;color:#ffd76e}
.rp-card .rp-st{font-size:calc(12px * var(--fscale));opacity:.95}
/* 字卡消息 */
.wc-chip{background:var(--accent-soft);color:var(--accent-strong);border-radius:10px;padding:8px 12px;margin:3px 0;font-size:calc(14px * var(--fscale));display:block}
/* 抉择卡片 */
.dilem-card{width:220px}
.dilem-card .opt{padding:8px 10px;border-radius:8px;background:var(--bg-secondary);margin-top:6px;font-size:calc(14px * var(--fscale))}
.dilem-card .opt.picked{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
/* 问卷卡片与详情弹窗 */
.q-card{width:210px;padding:12px 14px;border-radius:12px;background:var(--bg-secondary)}
.q-card .q-tag{display:inline-block;font-size:calc(11px * var(--fscale));color:var(--accent-strong);background:var(--accent-soft);padding:2px 8px;border-radius:10px;margin-bottom:8px}
.q-card .q-q{font-size:calc(15px * var(--fscale));font-weight:600;line-height:1.45}
.q-card .q-st{font-size:calc(12px * var(--fscale));color:var(--text-muted);margin-top:8px}
.q-meta{background:var(--bg-secondary);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:calc(13px * var(--fscale));color:var(--text-secondary);line-height:1.9}
.q-question{font-size:calc(16px * var(--fscale));font-weight:700;line-height:1.5;margin-bottom:10px}
.q-options{margin:4px 0 10px}
.q-opt{padding:9px 11px;border-radius:9px;background:var(--bg-secondary);margin-top:7px;font-size:calc(14px * var(--fscale))}
.q-opt.picked{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.q-status{font-size:calc(13px * var(--fscale));color:var(--text-muted);margin:6px 0}
.q-myanswer{font-size:calc(15px * var(--fscale));line-height:1.6;background:var(--accent-soft);color:var(--text);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.q-rate{margin-top:6px}
.rate-row{display:flex;gap:10px;margin-top:8px}
.rate-btn{flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:calc(14px * var(--fscale))}
.rate-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rate-on{font-size:calc(14px * var(--fscale));font-weight:700;color:var(--accent-strong);margin-top:6px}
/* 聊天输入栏 */
.chat-inputbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--border);padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.chat-inputbar .add-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary)}
.chat-inputbar .add-btn svg{width:24px;height:24px}
.chat-inputbar textarea{flex:1;min-height:36px;max-height:120px;border-radius:18px;padding:8px 14px;font-size:calc(15px * var(--fscale))}
.send-btn{width:34px;height:34px;border-radius:50%;background:var(--accent);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.send-btn svg{width:18px;height:18px}
/* 加号面板 */
.plus-panel{position:absolute;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:5;background:var(--surface);padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--border);max-height:44vh;overflow-y:auto;border-radius:14px 14px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.quote-bar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--surface);border-top:1px solid var(--border);color:var(--text-secondary);font-size:calc(13px * var(--fscale))}
.quote-bar .quote-bar-in{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.quote-bar .quote-bar-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote-bar .quote-bar-x{font-size:16px;cursor:pointer;padding:2px 4px;line-height:1;color:var(--text-secondary)}
.plus-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;cursor:pointer}
.plus-item:active{background:var(--bg-secondary)}
.plus-item .ic{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-strong)}
.plus-item .ic svg{width:24px;height:24px}
.plus-item span{font-size:calc(12px * var(--fscale))}

/* tab 切换 */
.tabs{display:flex;background:var(--bg-secondary);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs .tab{flex:1;text-align:center;padding:8px;border-radius:9px;font-size:calc(14px * var(--fscale));cursor:pointer;color:var(--text-secondary)}
.tabs .tab.active{background:var(--surface);color:var(--accent-strong);font-weight:600;box-shadow:var(--shadow-soft)}
.letter-group{margin-bottom:16px}
.lg-head{display:flex;align-items:center;gap:10px;margin:2px 4px 8px}
.lg-name{font-size:calc(15px * var(--fscale));font-weight:700}
.letter-card{background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-soft);cursor:pointer;border-left:3px solid var(--accent)}
.lc-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lc-name{font-size:calc(15px * var(--fscale));font-weight:700}
.lc-star{font-size:calc(18px * var(--fscale));color:var(--accent);cursor:pointer;flex:none;line-height:1}
.lc-time{font-size:calc(12px * var(--fscale));color:var(--text-secondary);margin:5px 0 8px}
.lc-body{font-size:calc(14px * var(--fscale));color:var(--text);line-height:1.6;overflow:hidden}
.cat-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--bg-secondary);font-size:calc(13px * var(--fscale));cursor:pointer;margin:0 8px 8px 0}
.cat-chip.active{background:var(--accent);color:#fff}
/* 字卡分类：横向紧凑卡片，一行两个 */
.cat-card{width:calc(50% - 5px);box-sizing:border-box;background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cat-card .cc-top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.cat-card .cc-name{font-size:calc(14px * var(--fscale));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cat-card .cc-count{font-size:calc(11px * var(--fscale));color:var(--text-muted);white-space:nowrap}
.cat-card .cc-actions{display:flex;gap:6px}
.cat-card .cc-actions button{flex:1;border:none;border-radius:8px;padding:6px 0;font-size:calc(12px * var(--fscale));cursor:pointer;background:var(--bg-page)}
.cat-card .cc-actions button:last-child{color:var(--danger)}

/* 表情包网格 */
.sticker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sticker-cell{height:92px;min-width:0;background:var(--bg-secondary);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative}
.sticker-cell img{width:100%;height:100%;object-fit:contain}
.poke-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:40vh;overflow-y:auto;margin:10px auto 0;max-width:280px;width:fit-content}
.poke-opt{background:var(--bg-secondary);border-radius:10px;padding:7px 5px;text-align:center;font-size:calc(13px*var(--fscale));cursor:pointer;border:1px solid transparent;line-height:1.3;white-space:nowrap}
.poke-opt:active{background:var(--accent-soft);color:var(--accent-strong)}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.dialog-head h3{margin:0}

/* 悬浮播放器 */
#player{position:fixed;right:12px;bottom:calc(var(--nav-h) + 16px);z-index:50;max-width:340px}
.player-mini{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border:1px solid var(--btn-sec-border);border-radius:999px;padding:10px 14px;box-shadow:var(--shadow-soft);backdrop-filter:blur(6px)}
[data-theme="dark"] .player-mini{background:rgba(58,52,68,.92)}
.player-mini .pname{font-size:calc(14px * var(--fscale));max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pctrl{width:38px;height:38px;border-radius:50%;background:transparent;border:none;color:var(--accent-strong);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pctrl svg{width:20px;height:20px}
.player-card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow-soft)}
.player-cover{width:56px;height:56px;border-radius:12px;background:linear-gradient(150deg,var(--accent),var(--accent-strong));display:flex;align-items:center;justify-content:center;color:#fff;float:left;margin-right:12px}
.player-cover svg{width:26px;height:26px}
/* 音乐库：左大图 + 右歌单分栏 */
.music-split{display:flex;gap:12px;align-items:stretch;min-height:56vh}
.music-cover{flex:none;width:40%;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(160deg,var(--accent),var(--accent-strong));display:flex;align-items:center;justify-content:center;min-height:280px;color:#fff}
.music-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.music-cover>svg{width:52px;height:52px;opacity:.9}
.music-cover-tag{position:absolute;left:10px;right:10px;bottom:10px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.35);color:#fff;font-size:calc(12px * var(--fscale));text-align:center;backdrop-filter:blur(4px)}
/* 歌单页：全屏背景图 + 磨砂歌曲列表（序号/歌名/时长，点歌直接播放） */
.music-page{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
.music-bg{position:absolute;inset:0;z-index:0}
.music-bg img{width:100%;height:100%;object-fit:cover}
.music-bg.grad{background:linear-gradient(165deg,#FBF4F7,#F3EDF7)}
.music-page::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.04) 28%,rgba(15,15,28,.5))}
.music-toolbar{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 14px 10px;color:#fff}
.music-t{font-size:calc(19px * var(--fscale));font-weight:700}
.music-n{font-size:calc(12px * var(--fscale));color:rgba(255,255,255,.85);background:rgba(255,255,255,.18);padding:2px 10px;border-radius:999px;backdrop-filter:blur(4px)}
.music-up{flex:none;border:none;padding:7px 14px;border-radius:999px;background:#fff;color:#7c5bb0;font-size:calc(13px * var(--fscale));font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.pl-list{position:relative;z-index:2;flex:1;overflow-y:auto;padding:6px 14px 20px;display:flex;flex-direction:column;gap:8px}
.pl-row{position:relative;overflow:hidden;color:#fff;cursor:pointer}
.pl-body{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:13px 14px;border-radius:12px;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);transition:transform .22s ease;will-change:transform}
.pl-row:active .pl-body{background:rgba(255,255,255,.24)}
.pl-row.sel .pl-body{background:rgba(103,214,137,.35);border-color:rgba(103,214,137,.5)}
.pl-del{position:absolute;right:0;top:0;bottom:0;width:76px;background:#e5484d;color:#fff;border:none;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;transform:translateX(100%);transition:transform .22s ease;cursor:pointer;border-radius:0 12px 12px 0}
.pl-row.open-del .pl-body{transform:translateX(-76px)}
.pl-row.open-del .pl-del{transform:translateX(0)}
.pl-check{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:transparent}
.pl-check.on{background:#67D689;border-color:#67D689}
.music-multibar{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 14px;margin:0 14px 12px;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-size:14px;backdrop-filter:blur(8px)}
.music-multibar b{color:#ffe27a}
.mb-del{flex:none;border:none;padding:7px 16px;border-radius:999px;background:#e5484d;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.mb-cancel{flex:none;border:none;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;font-size:13px;cursor:pointer}
.pl-idx{flex:none;width:22px;text-align:center;font-size:calc(13px * var(--fscale));color:rgba(255,255,255,.78);font-variant-numeric:tabular-nums}
.pl-main{flex:1;min-width:0}
.pl-name{font-size:calc(15px * var(--fscale));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-artist{font-size:calc(11px * var(--fscale));color:rgba(255,255,255,.75);margin-top:2px}
.pl-dur{flex:none;font-size:calc(12px * var(--fscale));color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums}
.pl-empty{position:relative;z-index:2;text-align:center;color:rgba(255,255,255,.85);font-size:calc(14px * var(--fscale));padding:40px 20px}
.music-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.music-list .list-wrap{max-height:56vh;overflow:auto}
input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border);width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent)}

/* 通话全屏 */
#callScreen{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:64px 24px 80px;background:linear-gradient(180deg,#7E6B9D,#4E435F);color:#fff}
#callScreen.on{display:flex}
.call-mini{width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
#callFloat{position:fixed;z-index:101;display:none;align-items:center;gap:10px;background:linear-gradient(90deg,#7E6B9D,#5A4C70);color:#fff;padding:10px 14px;border-radius:40px;box-shadow:0 8px 24px rgba(0,0,0,.25);left:50%;bottom:110px;transform:translateX(-50%);touch-action:none}
#callFloat .cf-btn{width:32px;height:32px;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex:none}
/* 经期管理 */
.p-phase{font-size:calc(22px * var(--fscale));font-weight:800;margin-top:4px}
.p-big{font-size:calc(30px * var(--fscale));font-weight:800;line-height:1}
.p-track{position:relative;height:10px;border-radius:6px;background:#eee;margin:16px 0 6px}
.p-track-fill{position:absolute;top:0;left:0;height:100%;border-radius:6px;background:linear-gradient(90deg,#E95A78,#C88FB0)}
.p-track-ovu{position:absolute;top:-4px;width:2px;height:18px;background:#fff;border:1px solid #C88FB0;transform:translateX(-1px)}
.p-track-dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #E95A78;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.p-tagrow{display:flex;gap:16px;font-size:calc(12px * var(--fscale));margin:2px 0 8px}
.p-tag{font-size:calc(12px * var(--fscale))}
.p-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:calc(11px * var(--fscale));color:var(--text-secondary);margin:8px 0 2px}
.p-week span{padding:4px 0}
.p-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:2px}
.p-day{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:calc(13px * var(--fscale));position:relative;color:var(--text)}
.p-day.blank{background:transparent}
.p-day.p-actual{background:#E95A78;color:#fff;font-weight:700}
.p-day.p-predict{background:#E95A7833;color:#E95A78;font-weight:600;border:1px dashed #E95A7888}
.p-day.p-ovu{background:#C88FB033;color:#B07BC8;font-weight:600}
.p-day.today{outline:2px solid #7FA0C9;outline-offset:-2px}
.icon-btn{background:transparent;border:none;font-size:calc(20px * var(--fscale));color:var(--text-secondary);width:30px;height:30px;line-height:30px;text-align:center;border-radius:6px}
.p-day.p-start{outline:2px solid #D8B84A;outline-offset:-2px;border-radius:8px}
.p-day .p-dot{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #0002}
.p-legend{display:flex;gap:14px;font-size:calc(11px * var(--fscale));color:var(--text-secondary);margin-top:8px}
.p-legend .lg{display:flex;align-items:center;gap:4px}
.p-legend .lg::before{content:'';width:10px;height:10px;border-radius:3px;display:inline-block}
.p-legend .lg.actual::before{background:#E95A78}
.p-legend .lg.predict::before{background:#E95A7833;border:1px dashed #E95A78}
.p-legend .lg.ovu::before{background:#C88FB033;border:1px solid #C88FB0}
.p-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;gap:8px}
.p-row>span{font-size:calc(14px * var(--fscale));color:var(--text)}
.p-row input{font-size:calc(14px * var(--fscale));text-align:right;border:1px solid var(--border,#ddd);border-radius:8px;padding:6px 8px;background:var(--bg,#fff);color:var(--text)}
.chip{padding:6px 14px;border-radius:16px;border:1px solid var(--border,#ddd);background:var(--bg,#fff);color:var(--text);font-size:calc(13px * var(--fscale));cursor:pointer}
.chip.on{background:#E95A78;border-color:#E95A78;color:#fff}
.wmi-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
#dlgBody textarea{width:100%;font-size:calc(14px * var(--fscale));border:1px solid var(--border,#ddd);border-radius:10px;padding:8px 10px;background:var(--bg,#fff);color:var(--text);resize:none;font-family:inherit}
/* 一起听歌（网易云式：双头像耳机连线 + 黑胶播放器） */
/* 一起听歌-整屏态（放大时） */
#togetherScreen{position:fixed;inset:0;z-index:100;display:none;background:#fff;overflow:hidden}
#togetherScreen.on{display:flex}
[data-theme="dark"] #togetherScreen{background:#3A3440}
.tg-page{width:100%;max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;box-sizing:border-box}
.tg-tabs{display:flex;gap:8px;padding:10px 16px 0;flex:none;justify-content:center}
.tg-tabs span{padding:8px 18px;border-radius:999px;font-size:calc(14px * var(--fscale));font-weight:600;color:var(--text-secondary);cursor:pointer;background:#F4F0F8}
.tg-tabs span.on{background:var(--accent);color:#fff}
.tg-body{flex:1;overflow:auto;padding:14px 16px 20px;min-height:0}

.tg-vinyl{width:158px;height:158px;border-radius:50%;margin-top:30px;background:radial-gradient(circle at center,#fff 34%,#E7DBEF 36%,#CDB7E0 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(120,90,150,.28);position:relative;flex:none}

@keyframes spin{to{transform:rotate(360deg)}}
.tg-hole{width:62px;height:62px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:calc(11px * var(--fscale));line-height:1.25;color:#7E6B9D;overflow:hidden}
.tg-prog{width:100%;margin-top:22px}
.tg-controls{display:flex;gap:30px;align-items:center;margin-top:20px}

/* 右：歌单列表 */
.tg-right{flex:1;min-width:0;display:flex;flex-direction:column;background:rgba(255,255,255,.6);border:1px solid var(--btn-sec-border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-soft)}
[data-theme="dark"] .tg-right{background:rgba(0,0,0,.25)}
.tg-listhead{padding:12px 14px;font-weight:700;font-size:calc(14px * var(--fscale));color:var(--text);border-bottom:1px solid var(--border);flex:none;display:flex;align-items:center;justify-content:space-between}
.tg-add{background:var(--accent);color:#fff;border:none;font-size:calc(12px * var(--fscale));padding:6px 12px;border-radius:8px;font-weight:600}
.tg-songlist{flex:1;overflow:auto;padding:4px 0}
.tg-srow{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0;font-size:calc(13px * var(--fscale));color:var(--text);cursor:pointer;border-bottom:1px solid rgba(0,0,0,.03)}
.tg-srow .pl-body{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:1;min-width:0;padding:11px 14px;border-radius:0;background:transparent;backdrop-filter:none;border:none;transition:transform .22s ease;will-change:transform}
.tg-srow.open-del .pl-body{transform:translateX(-76px)}
.tg-srow.open-del .pl-del{transform:translateX(0)}
.tg-srow .pl-del{position:absolute;right:0;top:0;bottom:0;width:76px;background:#e5484d;color:#fff;border:none;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;transform:translateX(100%);transition:transform .22s ease;cursor:pointer;border-radius:0 12px 12px 0}
.tg-srow .pl-check{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:transparent;margin-right:8px}
.tg-srow .pl-check.on{background:var(--accent);border-color:var(--accent)}
.tg-srow:active .pl-body{background:rgba(120,90,150,.08)}
.tg-srow.on .pl-body{color:var(--accent-strong);font-weight:600}
.tg-srow.tg-sel .pl-body{background:rgba(120,90,150,.12);color:var(--accent-strong)}
#tgMultiBar{position:sticky;bottom:0;background:var(--surface);padding:10px 14px;gap:12px;justify-content:flex-end;border-top:1px solid var(--border);display:flex;align-items:center}
.tg-sname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 一起听歌-整屏态：音乐库式 左大图封面 + 右歌单 */
.tg-cover{flex:none;width:54%;height:100%;min-height:0;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(165deg,#F7C8DD,#C79BE6 60%,#9A76CF);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff}

.tg-cover .tg-avatars{margin-top:0}
.tg-cover .tg-vinyl{width:126px;height:126px;margin-top:2px;flex:none}
.tg-cover .tg-vinyl.spin{animation:spin 7s linear infinite}

.tg-cover .tg-song{color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.2);font-size:calc(18px * var(--fscale));margin-top:0;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-cover .tg-sub{color:rgba(255,255,255,.85);margin-top:0}
.tg-cover .tg-prog{width:78%;margin-top:6px}
.tg-cover .tg-prog input{background:rgba(255,255,255,.4)}
.tg-cover .tg-prog input::-webkit-slider-thumb{background:#fff}
.tg-cover .tg-prog .row{color:rgba(255,255,255,.92)}
.tg-cover .tg-controls{width:78%;gap:30px;margin-top:4px}
.tg-cover .pctrl{color:#fff}
.tg-cover .tg-play{background:#fff;color:var(--accent-strong);box-shadow:0 8px 22px rgba(0,0,0,.25)}
.tg-cover-bar{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.tg-cover .icon-btn{width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}
.tg-cover .icon-btn svg{width:16px;height:16px}

<script>
/* ============================================================
 * 工具层：ID / 时间 / toast / DOM
 * ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowStr=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtTime(iso){if(!iso)return'';const d=new Date(iso);const p=n=>String(n).padStart(2,'0');const hm=`${p(d.getHours())}:${p(d.getMinutes())}`;const today=new Date();const same=d.toDateString()===today.toDateString();
  if(same)return hm;return `${p(d.getMonth()+1)}-${p(d.getDate())} ${hm}`;}
function dataUrlToBlob(du){const [m,b]=du.split(',');const mime=/:(.*?);/.exec(m)[1];const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}
function blobToDataURL(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob);});}
/* 头像专用：读图并压缩成小尺寸 base64，避免大图导致移动端存储/渲染出错 */
function compressAvatarFile(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const max=256;let w=img.width,h=img.height;
      if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.max(1,Math.round(w*r));h=Math.max(1,Math.round(h*r));}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      let out=cv.toDataURL('image/jpeg',0.85);
      if(out.length>120000){ // 仍过大再压到更小
        const r2=Math.min(128/w,128/h);const w2=Math.max(1,Math.round(w*r2)),h2=Math.max(1,Math.round(h*r2));
        cv.width=w2;cv.height=h2;ctx.fillStyle='#fff';ctx.fillRect(0,0,w2,h2);ctx.drawImage(img,0,0,w2,h2);
        out=cv.toDataURL('image/jpeg',0.8);
      }
      resolve(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image load failed'));};
    img.src=url;
  });
}
/* 头像对象URL缓存（刷新后重建） */
const urlCache=new Map();
/* 头像镜像到 localStorage：正常刷新绝不丢失（优先读取） */
function avStore(id,data){if(!id||!data||typeof data!=='string')return;try{localStorage.setItem('dm_av_'+id,data);}catch(e){}}
function avLoad(id){try{const v=localStorage.getItem('dm_av_'+id);if(v&&v.startsWith('data:image')&&v.length<200000)return v;if(v){try{localStorage.removeItem('dm_av_'+id);}catch(e){}} }catch(e){}return null;}
function avSrc(b){if(!b)return null;if(typeof b==='string')return b;try{return URL.createObjectURL(b);}catch(e){return null;}}
function avatarURL(rec){if(!rec)return null;
  const ls=avLoad(rec.id);if(ls)return ls;
  if(!rec.avatarBlob)return null;
  if(typeof rec.avatarBlob==='string')return rec.avatarBlob;
  const k=rec.id+'|'+(rec._m||0);
  if(urlCache.has(k))return urlCache.get(k);const u=URL.createObjectURL(rec.avatarBlob);urlCache.set(k,u);return u;}
function myAvatarHTML(){const me=state.config.profile||{};
  const ls=avLoad('me');if(ls)return `<div class="avatar sm msg-avatar msg-avatar-small"><img src="${ls}"></div>`;
  if(!me.avatarBlob)return `<div class="avatar sm msg-avatar msg-avatar-small">${esc((me.nickname||'我')[0])}</div>`;
  if(!me._av)me._av=avSrc(me.avatarBlob);
  return `<div class="avatar sm msg-avatar msg-avatar-small"><img src="${me._av}"></div>`;}
async function migrateAvatars(){
  // 头像统一转字符串并镜像到 localStorage，任何浏览器刷新都不丢
  try{
    const me=state.config.profile;
    if(me&&me.avatarBlob){
      if(me.avatarBlob instanceof Blob){try{me.avatarBlob=await blobToDataURL(me.avatarBlob);}catch(e){me.avatarBlob=null;}}
      avStore('me',me.avatarBlob);
      await saveConfig();
    }
    let changed=false;
    for(const c of state.contacts){
      if(c.avatarBlob){
        if(c.avatarBlob instanceof Blob){try{c.avatarBlob=await blobToDataURL(c.avatarBlob);}catch(e){c.avatarBlob=null;}changed=true;}
        avStore(c.id,c.avatarBlob);
        if(changed)await dbPut('contacts',c);
      }
    }
    if(changed)state.contacts=await dbAll('contacts');
  }catch(e){}
}
function shortSongName(n){n=n||'';const s=n.replace(/\.(mp3|m4a|aac|wav|ogg|flac)$/i,'');return s.length>9?s.slice(0,9)+'…':s;}

/* ============================================================
 * 统一随机决策模块（公平二选一 / 等概率 / 无放回 / 区间整数）
 * ============================================================ */
const RND={
  pick2:()=>Math.random()<0.5,                       // 公平二选一
  byProb:(p)=>Math.random()*100<p,                  // 按 1-100 概率
  intInclusive:(min,max)=>{min=Math.round(min);max=Math.round(max);if(max<min)[min,max]=[max,min];return Math.floor(Math.random()*(max-min+1))+min;},
  equalPick:(arr)=>arr[Math.floor(Math.random()*arr.length)],
  sampleWithout:(arr,n)=>{const a=[...arr];n=Math.min(n,a.length);const out=[];while(out.length<n&&a.length){const i=Math.floor(Math.random()*a.length);out.push(a.splice(i,1)[0]);}return out;},
  sampleCount:(min,max)=>RND.intInclusive(min,max),
  int:(min,max)=>RND.intInclusive(min,max),
};

/* ============================================================
 * IndexedDB 层：单库多表，Blob 直接存
 * ============================================================ */
const APP_VER='v-109c';
const DB_NAME='dreamchat-v3',DB_VER=3;
const STORES=['contacts','groups','sessions','messages','wordCards','wordCardCats','stickers','stickerCats',
'pokeMsgs','pokeCats','greetings','redPackets','moments','momentLikes','momentComments','dilemmas',
'qBank','qRecords','callRecords','music','playlists','musicInvitations','letters','diaries','backgrounds',
'config','scheduledTasks','decisions','periodConfig','periodLogs','kaomojis'];
let db=null,_dbOpening=null;
function dbStores(){return STORES.filter(s=>db&&db.objectStoreNames.contains(s));}
function openDB(){return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,DB_VER);
  req.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});};
  req.onsuccess=e=>{db=e.target.result;db.onversionchange=()=>{try{db.close();}catch(x){}db=null;};resolve(db);};
  req.onerror=e=>reject(e);
});}
function ensureDB(){if(db)return Promise.resolve(db);if(!_dbOpening){_dbOpening=openDB().then(d=>{_dbOpening=null;return d;}).catch(e=>{_dbOpening=null;throw e;});}return _dbOpening;}
function tx(store,mode){if(!db)throw new Error('DB_NOT_OPEN');return db.transaction(store,mode).objectStore(store);}
const dbAll=async(s)=>{await ensureDB();return new Promise((res,rej)=>{const r=tx(s,'readonly').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=rej;});};
const dbGet=async(s,id)=>{await ensureDB();return new Promise((res,rej)=>{const r=tx(s,'readonly').get(id);r.onsuccess=()=>res(r.result);r.onerror=rej;});};
const dbPut=async(s,rec)=>{await ensureDB();rec._m=Date.now();return new Promise((res,rej)=>{const r=tx(s,'readwrite').put(rec);r.onsuccess=()=>res(rec);r.onerror=rej;});};
const dbDel=async(s,id)=>{await ensureDB();return new Promise((res,rej)=>{const r=tx(s,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=rej;});};
const dbClear=async(s)=>{await ensureDB();return new Promise((res,rej)=>{const r=tx(s,'readwrite').clear();r.onsuccess=()=>res();r.onerror=rej;});};

/* ============================================================
 * 全局状态
 * ============================================================ */
const state={
  route:'messages', stack:[],
  contacts:[], groups:[], sessions:[], messages:[],
  wordCards:[], wordCardCats:[], stickers:[], stickerCats:[],
  poke:[], greetings:[], redPackets:[], moments:[], likes:[], comments:[],
  dilemmas:[], qBank:[], qRecords:[], callRecords:[],
  music:[], playlists:[], invitations:[], letters:[], diaries:[], kaomojis:[],
  config:{theme:'light',appName:'梦角聊天'},
  activeSessionId:null, multiSelect:new Set(), multiMode:false,
  musicSel:[], musicMulti:false,
  call:{active:false},
  player:{open:false,expanded:false,audio:null,src:null,sessionId:null,index:0},
};
/* ============================================================
 * 配置 / 主题
 * ============================================================ */
async function loadConfig(){
  const c=await dbGet('config','global')||{};
  state.config=Object.assign({theme:'light',appName:'梦角聊天',dark:false,customCss:''},c);
  state.push=Object.assign({on:false,dm:false,group:false,moments:false},c.push||{});
  state.keepalive=Object.assign({audioOn:false,wl:false,auto:false},c.keepalive||{});
  state.wallet=Object.assign({balance:0,txns:[]},c.wallet||{});
  state.waimai=Object.assign({cart:{shop:-1,items:{}},coupons:[],orders:[]},c.waimai||{});
  applyTheme();injectCss();
}
async function saveWallet(){state.config.wallet=state.wallet;await saveConfig();}
async function saveConfig(){await dbPut('config',{id:'global',...state.config,_m:Date.now()});}
function applyTheme(){document.documentElement.setAttribute('data-theme',state.config.theme);}
function injectCss(){
  let st=$('#customCss');
  if(!st){st=document.createElement('style');st.id='customCss';document.head.appendChild(st);}
  st.textContent=state.config.customCss||'';
}
async function toggleTheme(){state.config.theme=state.config.theme==='dark'?'light':'dark';applyTheme();await saveConfig();render();}
function openThemeDialog(){
  const on=state.config.theme==='dark';
  showDialog(`<h3>夜间模式</h3><div class="setting-row"><span>夜间模式</span><div class="switch ${on?'on':''}" id="ntSwitch"></div></div>
  <p class="tiny" style="margin-top:8px">开启后背景与文字切换为深暖紫灰，方便夜间阅读。</p>`,'关闭',closeDialog,true);
  $('#ntSwitch').onclick=async()=>{const s=$('#ntSwitch');s.classList.toggle('on');state.config.theme=s.classList.contains('on')?'dark':'light';applyTheme();await saveConfig();};
}

/* ============================================================
 * 路由 / 顶栏 / 导航
 * ============================================================ */
const VIEW=$('#view'),TOP=$('#topbar'),BOTTOM=$('#bottomnav');
const ROUTES={messages:'消息',contacts:'通讯录',discover:'发现',me:'我的'};
function go(route,param){
  if(state.route!==route)state.stack.push({route:state.route,param:state._param});
  state._param=param;state.route=route;state.multiMode=false;state.multiSelect=new Set();
  closeChatOverlay();
  render();
}
function closeChatOverlay(){const sc=$('#chatScreen');if(sc){sc.remove();document.body.classList.remove('in-chat');VIEW.classList.remove('hidden');}}
function goBack(){
  const prev=state.stack.pop();
  state.multiMode=false;state.multiSelect=new Set();
  if(prev){state.route=prev.route;state._param=prev.param;render();}
  else{state.route='messages';state._param=null;render();}
}
function setTopTitle(t){$('#topTitle').textContent=t;}
function render(){
  const r=state.route;
  BOTTOM.classList.toggle('hidden',['chat','contactDetail','wordcard','sticker','poke','redPacket','dilemma','moments','publishMoment','momentsSettings','music','letter','diary','settings','backup','callSettings','about','qBank','activeSettings','replySettings','replyRatio','background','keepalive','push','musicLib','invitations','callRecord','profile','kaomoji','waimaiSpin'].includes(r));
  TOP.classList.toggle('hidden',r==='chat');
  $('#backBtn').style.display=(state.stack.length>0)||['contactDetail','wordcard','sticker','poke','redPacket','dilemma','moments','publishMoment','momentsSettings','music','letter','diary','settings','backup','qBank','activeSettings','replySettings','replyRatio','background','keepalive','push','invitations','callRecord','profile','callSettings','about','wallet','couple','waimai','waimaiOrders','waimaiCoupons','waimaiGifts','period','kaomoji'].includes(r)?'flex':'none';
  VIEW.scrollTop=0;
  const map={messages:renderSessions,contacts:renderContacts,discover:renderDiscover,me:renderMe,
    chat:renderChat,contactDetail:renderContactDetail,wordcard:renderWordcards,sticker:renderStickers,kaomoji:renderKaomojis,
    poke:renderPoke,redPacket:renderRedPackets,dilemma:renderDilemmas,moments:renderMoments,publishMoment:renderPublishMoment,
    music:renderMusic,letter:renderLetters,diary:renderDiaries,settings:renderSettings,backup:renderBackup,
    qBank:renderQBank,activeSettings:renderActiveSettings,replySettings:renderReplySettings,replyRatio:renderReplyRatio,
    background:renderBackground,keepalive:renderKeepalive,push:renderPush,invitations:renderInvitations,
    callRecord:renderCallRecord,profile:renderProfile,callSettings:renderCallSettings,about:renderAbout,wallet:renderWallet,couple:renderCouple,period:renderPeriod,waimaiSpin:renderWaimaiSpin,
    momentsSettings:renderMomentsSettings,
    waimai:renderWaimai,waimaiOrders:renderWaimaiOrders,waimaiCoupons:renderWaimaiCoupons,waimaiGifts:renderWaimaiGifts};
  setTopTitle(ROUTES[r]||'');
  $('#topRightSlot').innerHTML=r==='contacts'?`<button class="icon-btn" title="添加" onclick="openContactsPlus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>`
    :r==='moments'?`<button class="icon-btn" title="更多" onclick="momentsMenu()"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>`
    :r==='publishMoment'?`<button class="btn-main btn-sm" onclick="publishMoment()">发布</button>`:'';
  (map[r]||renderSessions)(state._param);
  $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.nav===r));
  applyHomeBg();
  renderPlayer();
}
$$('.nav-item').forEach(n=>n.addEventListener('click',()=>{state.stack=[];state.route=n.dataset.nav;state._param=null;state.multiMode=false;render();}));

/* ============================================================
 * 联系人 & 分组 & 群聊
 * ============================================================ */
async function saveContact(data){
  const rec=Object.assign({id:uid(),createdAt:nowStr(),groupId:null},data);
  await dbPut('contacts',rec);state.contacts=await dbAll('contacts');return rec;
}
async function deleteContact(id){
  await dbDel('contacts',id);
  // 清理其私聊会话与消息由用户在会话列表决定；这里删除联系人即可
  state.contacts=await dbAll('contacts');
}
function contactById(id){return state.contacts.find(c=>c.id===id);}
function pickContact(){
  if(!state.contacts||!state.contacts.length)return null;
  const cur=state.activeContactId?contactById(state.activeContactId):null;
  return cur||RND.equalPick(state.contacts);
}

function renderContacts(){
  let html=`<div class="field"><input type="text" id="contactSearch" placeholder="搜索昵称 / 备注" oninput="filterContacts()"></div>`;
  if(!state.contacts.length){html+=emptyStateSvg('联系人','还没有联系人，点右上角 + 添加好友');}
  else{
    html+=`<div class="section-title">联系人</div><div class="list-wrap">`;
    state.contacts.forEach(c=>{
      const au=avatarURL(c);
      html+=`<div class="list-row contact-row" data-id="${c.id}">
        <div class="avatar sm">${au?`<img src="${au}">`:esc((c.nickname||'角')[0])}</div>
        <div class="list-main"><div class="name">${esc(c.nickname||'未命名')}${c.remark?` <span class="tiny">(${esc(c.remark)})</span>`:''}</div>
        ${c.bio?`<div class="sub">${esc(c.bio)}</div>`:''}</div></div>`;
    });
    html+=`</div>`;
  }
  VIEW.innerHTML=html;
  $$('.contact-row').forEach(el=>el.addEventListener('click',()=>go('contactDetail',el.dataset.id)));
}
function openContactsPlus(){
  showDialog(`<h3>通讯录</h3>
    <div class="list-row" onclick="closeDialog();openAddContact()"><div class="list-main"><div class="name">添加好友</div></div>${chevRow}</div>
    <div class="list-row" onclick="closeDialog();openCreateGroup()"><div class="list-main"><div class="name">创建群聊</div></div>${chevRow}</div>`,'取消',()=>{},false);
}
function filterContacts(){const q=$('#contactSearch').value.trim();$$('.contact-row').forEach(r=>{const c=contactById(r.dataset.id);const hit=!q||(c.nickname||'').includes(q)||(c.remark||'').includes(q);r.style.display=hit?'flex':'none';});}

function emptyStateSvg(title,sub){return `<div class="empty-state"><div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg></div><div style="font-size:calc(15px * var(--fscale));font-weight:600">${esc(title)}</div><div class="tiny" style="margin-top:6px">${esc(sub)}</div></div>`;}

function openAddContact(){
  showDialog(`<h3>新建联系人</h3>
    <div class="field"><input type="text" id="f_nick" placeholder="输入昵称"></div>`,
    '确定',async()=>{
      const nickname=$('#f_nick').value.trim();if(!nickname)return toast('请输入昵称');
      await saveContact({nickname});
      closeDialog();toast('已添加');render();
    });
}
function groupOptions(){let h=`<option value="">未分组</option>`;state.groups.forEach(g=>h+=`<option value="${g.id}">${esc(g.name)}</option>`);return h;}

function openGroupManager(){
  const list=state.groups.map(g=>`<div class="list-row" style="cursor:default">
    <div class="list-main"><div class="name">${esc(g.name)}</div><div class="sub">${state.contacts.filter(c=>c.groupId===g.id).length} 位好友</div></div>
    <button class="btn-sec btn-sm" onclick="renameGroup('${g.id}')">改名</button>
    <button class="btn-danger btn-sm" onclick="deleteGroup('${g.id}')">删除</button></div>`).join('')||'<div class="empty-state"><div>暂无自定义分组</div></div>';
  showDialog(`<h3>好友分组</h3><div class="field"><input type="text" id="g_name" placeholder="新分组名称"></div>
    <button class="btn-main btn-sm" onclick="createGroup()">新建分组</button>
    <div style="margin-top:16px">${list}</div>`,'关闭',closeDialog,true);

/* ============================================================
 * 聊天页：消息渲染 / 发送 / 长按菜单 / 加号面板
 * ============================================================ */
async function persistMessage(msg){
  msg.id=msg.id||uid();msg.time=msg.time||nowStr();
  await dbPut('messages',msg);
  // 不再每发一条消息就整表读取 IndexedDB；本地状态增量更新，避免聊天明显慢半拍
  const existingIndex=state.messages.findIndex(x=>x.id===msg.id);
  if(existingIndex>=0)state.messages[existingIndex]=msg;else state.messages.push(msg);
  const s=sessionOf(msg.sessionId);
  if(s){
    const screen=$('#chatScreen');
    const viewing=state.route==='chat'&&state.activeSessionId===msg.sessionId&&!!screen&&screen.classList.contains('on')&&!document.hidden;
    if(msg.sender==='them'&&!viewing)s.unread=(s.unread||0)+1;
    s.lastMsg=previewOf(msg);s.lastTime=msg.time;
    await upsertSession(s);
    if(msg.sender==='them'&&viewing)appendNewMsgs(msg.sessionId);
  }
  if(msg.sender==='them'&&state.route==='messages')renderSessions();
  return msg;
}
function sessionOf(sid){return state.sessions.find(s=>s.id===sid);}
function sessionTitle(s){if(!s)return'';if(s.type==='dm'){const c=contactById(s.contactId);return c?.nickname||s.title||'对方';}return s.title;}
function themName(cid){const c=contactById(cid);return c?.nickname||'对方';}
function sessionThemAvatar(s){if(s.type!=='dm')return null;const c=contactById(s.contactId);return avatarURL(c);}
function msgsOf(sid){return state.messages.filter(m=>m.sessionId===sid).sort((a,b)=>new Date(a.time)-new Date(b.time));}

async function sendMessage(payload){
  const sid=state.activeSessionId;const s=sessionOf(sid);if(!s)return;
  const msg={id:uid(),sessionId:sid,sender:'me',recalled:false,...payload,time:nowStr()};
  // 先立即显示，再异步落库，避免等待 IndexedDB 完成后才看到气泡
  if(!state.messages.some(x=>x.id===msg.id))state.messages.push(msg);
  s.lastMsg=previewOf(msg);s.lastTime=msg.time;
  if(state.route==='chat'&&state.activeSessionId===sid)appendNewMsgs(sid);
  upsertSession(s).catch(e=>console.warn('更新会话预览失败',e));
  persistMessage(msg).catch(e=>{console.error('消息保存失败',e);toast('消息暂未保存，请检查浏览器存储空间');});
  maybeAutoReply(sid, msg);
}
// 把列表里还没有的消息追加到末尾，避免整屏重建导致卡顿
function appendNewMsgs(sid){
  const list=$('#chatMsgs');if(!list)return;
  if(!list.querySelector('.msg-row')){renderChat(sid);return;}
  const s=sessionOf(sid);
  const have=new Set(Array.from(list.querySelectorAll('.msg-row[data-mid],.msg-poke[data-mid],.msg-recalled[data-mid]')).map(x=>x.dataset.mid));
  let appended=0;
  msgsOf(sid).forEach(m=>{if(have.has(m.id))return;const frag=document.createElement('div');frag.innerHTML=bubbleHTML(m,s).trim();const node=frag.firstChild;if(node){list.appendChild(node);appended++;}});
  if(appended>0)list.scrollTop=list.scrollHeight;
}
function previewOf(m){
  if(m.recalled)return'消息已撤回';
  switch(m.type){case'image':return'[图片]';case'sticker':return'[表情包]';case'poke':return'拍了拍';case'redpacket':return`[红包] ${m.meta?.amount?'¥'+m.meta.amount:''}`;case'wordcard':return(m.meta?.cards||[]).map(c=>c.text||'').join(' ')+(m.meta?.kaomoji?' '+m.meta.kaomoji:'');case'dilemma':return'[抉择] '+m.meta?.question;case'question':return'[问卷] '+(m.meta?.q||'');case'call':return m.meta?.result||'通话结束';case'music':return'[一起听歌] '+m.meta?.songName;case'letter':return'[信件]';default:return m.content||'';}
}

  screen.innerHTML=`
    <div class="chat-head" style="position:relative">
      <button class="icon-btn" onclick="exitChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>

    <div class="chat-inputbar">
      <div class="add-btn" onclick="togglePlus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></div>
      <textarea id="chatInput" rows="1" placeholder="输入消息"></textarea>
      <button class="send-btn" onclick="doSendText()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>`;
  // 背景图固定在外层聊天页（fixed、不随消息滚动），避免发消息时背景往上窜
  if(bgUrl){
    screen.style.backgroundImage=`url(${bgUrl})`;
    screen.style.backgroundSize='cover';
    screen.style.backgroundPosition='center';
    screen.style.backgroundRepeat='no-repeat';
  } else {
    screen.style.backgroundImage='';
    screen.style.backgroundSize='';
    screen.style.backgroundPosition='';
    screen.style.backgroundRepeat='';
  }
  const ta=$('#chatInput');
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSendText();}});
  // 输入框随内容自动增高（上限120px），发送后复位
  ta.addEventListener('input',()=>{autoGrowTextarea(ta);});
  const list=$('#chatMsgs');list.scrollTop=list.scrollHeight;
  // 键盘弹出时跟随实际可视视口；滚动统一合并到一次动画帧，避免多个延迟任务反复跳动。
  const vv=window.visualViewport||null;
  let _keyboardAdjustRaf=0;
  let _chatScrollTimer=0;
  function _scrollChatToLatest(smooth=false){
    if(!screen||!screen.isConnected||document.activeElement!==ta)return;
    const box=screen.querySelector('#chatMsgs');
    if(!box)return;
    const top=box.scrollHeight;
    if(smooth && typeof box.scrollTo==='function') box.scrollTo({top,behavior:'smooth'});
    else box.scrollTop=top;
  }
  function _adjustChatViewport(){
    if(!screen||!screen.isConnected)return;
    if(_keyboardAdjustRaf)cancelAnimationFrame(_keyboardAdjustRaf);
    _keyboardAdjustRaf=requestAnimationFrame(()=>{
      _keyboardAdjustRaf=0;
      if(!screen.isConnected)return;
      const focused=(document.activeElement===ta);
      const visibleH=vv ? vv.height : window.innerHeight;
      const offsetY=vv ? Math.max(0,vv.offsetTop) : 0;
      if(focused && visibleH>0){
        screen.style.top=offsetY+'px';
        screen.style.height=visibleH+'px';
        screen.style.bottom='auto';
        screen.style.maxHeight=visibleH+'px';
      }else{
        screen.style.top='0px';
        screen.style.height='100dvh';
        screen.style.bottom='0px';
        screen.style.maxHeight='none';
      }
      // 视口变化期间只重置一个短计时器，等键盘尺寸稳定后再平滑贴近最新消息。
      if(focused){
        clearTimeout(_chatScrollTimer);
        _chatScrollTimer=setTimeout(()=>{
          requestAnimationFrame(()=>_scrollChatToLatest(true));
        },70);
      }
    });
  }
  ta.addEventListener('focus',()=>{
    _adjustChatViewport();
    clearTimeout(_chatScrollTimer);
    _chatScrollTimer=setTimeout(()=>{
      _adjustChatViewport();
      requestAnimationFrame(()=>_scrollChatToLatest(true));
    },70);
  });
  ta.addEventListener('blur',()=>{
    clearTimeout(_chatScrollTimer);
    setTimeout(_adjustChatViewport,80);
  });
  if(vv){vv.addEventListener('resize',_adjustChatViewport);vv.addEventListener('scroll',_adjustChatViewport);}
  window.addEventListener('resize',_adjustChatViewport);
  bindLongPress(list);

  screen.appendChild(fi);
}
function renderMessageList(sid){

function bubbleHTML(m,s){
  if(m.recalled)return `<div class="msg-recalled" data-mid="${m.id}">${m.sender==='me'?'你撤回了一条消息':`${sessionTitle(s)}撤回了一条消息`}</div>`;
  // 只有拍一拍：居中透明系统提示，去掉气泡框（正常消息、字卡都保留气泡框）；格式=（名字）+动作内容：我拍TA显示"我的名字+动作(对象替换为TA名)"，TA拍我显示"TA名+动作"
  if(m.type==='poke'){
    const them=sessionTitle(s);
    if(m.sender==='me'){
      const my=(state.config.profile&&state.config.profile.nickname)||'我';
      const body=esc(m.content).replace(/你/g,esc(them));
      return `<div class="msg-poke" data-mid="${m.id}">${esc(my)}${body}</div>`;
    }
    return `<div class="msg-poke" data-mid="${m.id}">${esc(them)}${esc(m.content)}</div>`;
  }
  const self=m.sender==='me';
  const au=self?null:sessionThemAvatar(s);
  const av=au?`<div class="avatar sm msg-avatar msg-avatar-small"><img src="${au}"></div>`:`<div class="avatar sm msg-avatar msg-avatar-small">${esc(sessionTitle(s)[0]||'我')}</div>`;
  let body='';
  switch(m.type){
    case'image':body=`<img src="${m.content}" alt="图片" style="max-width:120px;max-height:120px;width:auto;height:auto;object-fit:contain;border-radius:10px;display:block;cursor:zoom-in" onclick="viewImage(this.src)">`;break;
    case'sticker':body=`<img src="${m.content}" alt="表情包" style="max-width:120px">`;break;
    case'poke':body=`<span class="pick-tag">${esc(m.content)}</span>`;break;
    case'redpacket':{const meta=m.meta||{};const st=meta.status||'pending';
      const stTxt=m.sender==='them'?(st==='claimed'?'已领取':(st==='returned'?'已退回':'点击查看')):(st==='claimed'?'已领取':(st==='returned'?'对方已退回':'等待对方领取'));
      body=`<div class="rp-card" onclick="openRedPacket('${m.id}')">
      <div class="rp-amt">${meta.amount?`¥${meta.amount}`:'红包'}</div>
      <div class="rp-st">${stTxt}</div></div>`;break;}
    case'wordcard':body=(m.meta?.cards||[]).map(c=>`<span style="white-space:pre-wrap">${esc(c.text)}</span>`).join('<br>')+(m.meta?.kaomoji?`<br><span style="white-space:pre-wrap">${esc(m.meta.kaomoji)}</span>`:'');break;
    case'dilemma':{const meta=m.meta||{};body=`<div class="dilem-card"><div style="font-weight:600;margin-bottom:6px">${esc(meta.question)}</div>

    case'question':{const meta=m.meta||{};const rec=state.qRecords.find(x=>x.id===meta.qid);
      body=`<div class="q-card" onclick="showQDetail('${meta.qid}')">
        <div class="q-tag">${meta.asker==='me'?'我问TA':'TA问我'}</div>
        <div class="q-q">${esc(meta.q||'')}</div>
        <div class="q-st">${rec&&rec.status==='answered'?'已回答':'待回答'} · 点击查看</div></div>`;break;}
    case'call':{const meta=m.meta||{};body=`<div class="muted">${meta.result||'通话结束'}${meta.duration?' · '+meta.duration:''}</div>`;break;}
    case'music':{const meta=m.meta||{};return `<div class="msg-row ${self?'self':''}" data-mid="${m.id}">
      ${self?'':av}
      <div class="music-share" onclick="togetherFromMsg('${m.id}')">
        <div class="ms-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
        <div><div class="ms-tag">一起听歌</div><div class="ms-name">${esc(meta.songName||'歌曲')}</div></div>
      </div>
      ${self?myAvatarHTML():''}<span class="msg-time">${m.time.slice(11,16)}</span></div>`;break;}
    default:body=`<span style="white-space:pre-wrap">${m.quoteId?quotedHTML(m):''}${esc(m.content)}</span>`;
  }
  // 红包/图片/表情包直接显示，不套气泡（微信风格，避免双层包裹）
  const raw=rawTypes.has(m.type);

const rawTypes=new Set(['image','sticker','redpacket']);

function quotedHTML(m){
  const q=state.messages.find(x=>x.id===m.quoteId);if(!q)return'';
  const meta=q.meta||{};
  // 按被引用消息类型取摘要；并尽量从 content/meta/其他字段提取可读文本，避免只显示"[附件]"
  let txt='';
  if(q.type==='text'){txt=q.content||'';}
  else if(q.type==='wordcard'){txt=(q.meta?.cards||[]).map(c=>c.text||'').join(' ')+(q.meta?.kaomoji?(' '+q.meta.kaomoji):'');}
  else if(q.type==='poke'){txt=q.content||'拍了拍';}
  else if(q.type==='image'){txt='[图片]';}
  else if(q.type==='sticker'){txt='[表情包]';}
  else if(q.type==='redpacket'){txt='[红包]';}
  else if(q.type==='dilemma'){txt=meta.question||'[抉择]';}
  else if(q.type==='question'){txt=meta.q||'[问卷]';}
  else if(q.type==='call'){txt=meta.result||'通话结束';}
  else if(q.type==='music'){txt=meta.songName?('[歌曲]'+meta.songName):'[音乐]';}
  else if(q.type==='letter'){txt='[信件]';}
  else {txt=q.content||meta.question||meta.q||meta.result||meta.greeting||meta.text||q.text||'';}
  // 兜底：从可读字段尽力提取，实在没有才显示[附件]
  if(!txt){txt=meta.question||meta.q||meta.result||meta.greeting||meta.songName||meta.text||q.text||q.title||q.name||'';}
  txt=(txt||'').trim();
  if(!txt)txt='[附件]';
  if(txt.length>35)txt=txt.slice(0,35)+'…';
  return `<div class="quoted">${esc(txt)}</div>`;
}

/* 长按菜单：复制 / 撤回 / 引用 / 多选 */
let longPressTimer=null;
function bindLongPress(container){
  container.addEventListener('contextmenu',e=>e.preventDefault());
  let startX=0,startY=0;
  container.addEventListener('touchstart',e=>{
    const t=e.touches[0];startX=t.clientX;startY=t.clientY;
    const row=e.target.closest('.msg-row[data-mid]');if(!row)return;
    longPressTimer=setTimeout(()=>showCtxMenu(startX,startY,row.dataset.mid,true),450);
  },{passive:true});
  container.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    if(Math.abs(t.clientX-startX)>12||Math.abs(t.clientY-startY)>12)clearTimeout(longPressTimer);
  },{passive:true});
  container.addEventListener('touchend',()=>clearTimeout(longPressTimer));
  container.addEventListener('mousedown',e=>{
    const row=e.target.closest('.msg-row[data-mid]');if(!row)return;
    longPressTimer=setTimeout(()=>showCtxMenu(e.clientX,e.clientY,row.dataset.mid,false),450);
  });
  container.addEventListener('mouseup',()=>clearTimeout(longPressTimer));
  container.addEventListener('mousemove',e=>{/* 桌面移动不取消，保持长按 */}
  );
}
function showCtxMenu(x,y,mid,isTouch){
  clearTimeout(longPressTimer);
  const old=$('.ctx-menu');old?.remove();
  const m=state.messages.find(x=>x.id===mid);if(!m)return;
  const menu=document.createElement('div');menu.className='ctx-menu';
  // 对方消息：引用、删除；自己消息：复制、撤回、引用、多选
  const items=m.sender==='them'
    ?[['引用',quoteIcon,()=>quoteMsg(mid)],['删除',trashIcon,()=>deleteMsg(mid)]]
    :[['复制',copyIcon,()=>copyMsg(m)],['撤回',recallIcon,()=>recallMsg(mid)],['引用',quoteIcon,()=>quoteMsg(mid)],['多选',checkIcon,()=>enterMultiSelect(mid)]];
  menu.innerHTML=items.map(([t,ic],i)=>`<button data-i="${i}">${ic}<span>${t}</span></button>`).join('');
  document.body.appendChild(menu);
  const r=menu.getBoundingClientRect();
  const mw=r.width,mh=r.height;
  // 位置：优先在手指上方，空间不足则下方；水平居中于手指附近，且不出屏
  let left=Math.max(8,Math.min(x-mw/2,innerWidth-mw-8));
  let top=y-mh-16;
  if(top<8)top=y+24;
  if(top>innerHeight-mh-8)top=innerHeight-mh-8;
  menu.style.left=left+'px';menu.style.top=top+'px';
  const shown=Date.now();
  // 长按后的合成 click 会紧跟触发，300ms 内忽略，避免刚弹出就被关掉
  const closer=e=>{
    if(Date.now()-shown<300)return;
    if(e.target&&e.target.closest&&e.target.closest('.ctx-menu'))return;
    menu.remove();document.removeEventListener('pointerdown',closer);
    document.removeEventListener('touchstart',closer);
  };
  document.addEventListener('pointerdown',closer);
  document.addEventListener('touchstart',closer);
  $$('button',menu).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();items[+b.dataset.i][2]();menu.remove();}));
}

async function importWcFile(e){
  const f=e.target.files[0];if(!f)return;const text=await f.text();
  let added=0,dup=0,curCat=null;
  const lines=text.split(/\r?\n/);
  for(const raw of lines){const line=raw.trim();if(!line)continue;
    if(line.startsWith('#')){curCat=await ensureWcCat(line.slice(1).trim());continue;}
    let text=line,cat=null;
    const ci=line.indexOf(':');if(ci>0&&line.slice(0,ci).length<=12){const cn=line.slice(0,ci);cat=await ensureWcCat(cn);text=line.slice(ci+1).trim();}
    else if(curCat)cat=curCat;
    if(!text)continue;
    const exists=wcFilter().some(c=>c.text.trim()===text);
    if(exists){dup++;continue;}
    await dbPut('wordCards',{id:uid(),text,catId:cat?.id||wcPg.cat,scope:wcPg.scope,contactId:wcPg.contactId,createdAt:nowStr()});added++;
  }
  state.wordCards=await dbAll('wordCards');state.wordCardCats=await dbAll('wordCardCats');
  toast(`新增 ${added}，跳过重复 ${dup}`);renderWordcards();e.target.value='';
}
async function ensureWcCat(name){let c=state.wordCardCats.find(x=>x.name===name&&x.scope===wcPg.scope);if(!c){c={id:uid(),name,scope:wcPg.scope,contactId:wcPg.contactId,createdAt:nowStr()};await dbPut('wordCardCats',c);state.wordCardCats=await dbAll('wordCardCats');}return c;}

  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});downloadBlob(blob,'wordcards.txt');
}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}

async function scheduleQReply(qid){
  const cfg=await getCfg('qCfg',{proactive:{on:true,min:20,max:45},reply:{min:1,max:3}});
  const mins=RND.int(cfg.reply.min,cfg.reply.max);
  setTimeout(async()=>{
    const r=state.qRecords.find(x=>x.id===qid);if(!r||r.status!=='waiting')return;
    let ans=[];if(r.mode==='single')ans=[RND.equalPick(r.options)];else ans=RND.sampleWithout(r.options,RND.sampleCount(1,Math.min(2,r.options.length)));
    r.answer=ans;r.status='answered';r.answeredAt=nowStr();await dbPut('qRecords',r);state.qRecords=await dbAll('qRecords');
    await persistMessage({sessionId:r.sessionId,sender:'them',type:'question',meta:{qid:r.id,q:r.question,asker:'me',mode:r.mode,options:r.options,answered:true},recalled:false});
    const s=sessionOf(r.sessionId);if(s){s.lastMsg='回答了「'+r.question+'」';s.lastTime=nowStr();await upsertSession(s);}
    if(state.route==='chat'&&state.activeSessionId===r.sessionId)renderChat(r.sessionId);
  },mins*60*1000);
}

function pmFileInput(accept,multiple,onok){
  const inp=document.createElement('input');inp.type='file';inp.accept=accept;if(multiple)inp.multiple=true;inp.className='hidden';
  inp.style.position='fixed';inp.style.left='-9999px';
  document.body.appendChild(inp);
  inp.onchange=async()=>{const fs=[...inp.files];inp.remove();await onok(fs);};
  inp.click();
}

async function toggleFavLetter(id){

let letterProTimer=null;
const letterReplyTimers={};
// 从字卡库拼一封 TA 的信
async function writeLetterFromCards(kind,contactId,replyTo){
  const pool=state.wordCards;
  if(!pool||!pool.length)return;
  const n=Math.max(1,Math.min(RND.sampleCount(2,4),pool.length));
  const picked=RND.sampleWithout(pool,n);
  const title=kind==='reply'?'TA的回信':'TA的来信';
  await dbPut('letters',{id:uid(),direction:'them2me',kind,replyTo:replyTo||null,contactId:contactId||null,
    title,body:picked.map(p=>p.text).join('\n\n'),sourceCards:picked.map(p=>p.id),read:false,createdAt:nowStr(),generated:true});
  state.letters=await dbAll('letters');
  toast(kind==='reply'?'TA回了一封信':'TA写来一封信');
  if(state.route==='letter')renderLetters();
}
// 主动来信：按间隔循环
async function scheduleProactiveLetters(){
  if(letterProTimer){clearTimeout(letterProTimer);letterProTimer=null;}
  const cfg=await getCfg('letterCfg',{proactive:{on:true,min:500,max:750},reply:{min:680,max:1000}});
  if(!cfg.proactive.on)return;
  const mins=RND.int(cfg.proactive.min,cfg.proactive.max);
  letterProTimer=setTimeout(async()=>{
    const c=pickContact();
    await writeLetterFromCards('proactive',c?c.id:null);
    scheduleProactiveLetters();
  },mins*60*1000);
}
// 回信：我寄出后，按回复范围
async function scheduleReplyFor(contactId,replyTo){
  const cfg=await getCfg('letterCfg',{proactive:{on:true,min:500,max:750},reply:{min:680,max:1000}});
  const key=replyTo||contactId;
  if(letterReplyTimers[key])clearTimeout(letterReplyTimers[key]);
  const mins=RND.int(cfg.reply.min,cfg.reply.max);
  letterReplyTimers[key]=setTimeout(()=>writeLetterFromCards('reply',contactId,replyTo),mins*60*1000);
}

function swipeStart(e,el){const t=e.touches[0];swipeState={el,sx:t.clientX,sy:t.clientY,dx:0,dy:0,moved:false};}
function swipeMove(e,el){
  if(swipeState.el!==el)return;
  const t=e.touches[0];swipeState.dx=t.clientX-swipeState.sx;swipeState.dy=t.clientY-swipeState.sy;
  if(Math.abs(swipeState.dx)<8)return;
  swipeState.moved=true;
  if(Math.abs(swipeState.dx)>Math.abs(swipeState.dy)){
    e.preventDefault();
    if(swipeState.openEl&&swipeState.openEl!==el)closeSwipe(swipeState.openEl);
    const body=el.querySelector('.pl-body');const open=el.classList.contains('open-del');
    const x=Math.max(-80,Math.min(0,(open?-80:0)+swipeState.dx));
    body.style.transform=`translateX(${x}px)`;
  }
}
function swipeEnd(e,el){
  if(swipeState.el!==el)return;
  const open=el.classList.contains('open-del');
  const shouldOpen=(open?swipeState.dx>30:swipeState.dx<-40);
  el.querySelector('.pl-body').style.transform='';
  if(shouldOpen){if(swipeState.openEl&&swipeState.openEl!==el)closeSwipe(swipeState.openEl);el.classList.add('open-del');swipeState.openEl=el;}
  else el.classList.remove('open-del');

}

async function uploadMusic(){

  const valid=fs.filter(f=>!f.type||f.type.startsWith('audio/')||/\.(mp3|m4a|aac|wav|ogg|opus|flac|weba|mp4)$/i.test(f.name));

  let added=0,failed=0;const failedNames=[];

  try{
    const pl=await ensurePlaylist(state.activeSessionId||'global');if(!Array.isArray(pl.items))pl.items=[];
    // 非 iOS 用 Blob 直接写 IndexedDB（省空间）；iOS 的 IndexedDB 存 Blob 不可靠，取回后可能损坏导致无法播放，改用 dataURL 存储

      if(isIOS){rec.dataUrl=await blobToDataURL(f);}

    if(added&&failed)toast(`导入完成：成功 ${added} 首，失败 ${failed} 首；请检查浏览器存储空间。`);else if(added)toast(`已成功导入 ${added} 首歌曲`);else toast('导入失败：可能是浏览器存储空间不足或文件格式不受支持');

function bindDblTap(el,fn,ignoreSel){
  if(!el)return;
  let last=0;
  el.addEventListener('click',function(e){
    if(ignoreSel&&e.target&&e.target.closest&&e.target.closest(ignoreSel))return;
    const now=Date.now();
    if(now-last<300){last=0;fn();}
    else last=now;
  });
}
function bindTogetherSongs(){
  const rows=$$('#tgPanelSongs .tg-srow');
  if(state.musicMulti){
    renderTgMultiBar();refreshTgRows();
    rows.forEach(el=>{
      el.onclick=(e)=>{
        e.preventDefault();e.stopPropagation();
        const id=el.dataset.tg;const idx=state.musicSel.indexOf(id);
        if(idx>=0)state.musicSel.splice(idx,1);else state.musicSel.push(id);
        renderTgMultiBar();refreshTgRows();
      };
    });
  }else{
    rows.forEach(el=>{
      el.onclick=()=>{if(el.classList.contains('open-del')){el.classList.remove('open-del');return;}playSong(el.dataset.tg);};
      el.addEventListener('touchstart',e=>tgLongPressStart(e,el),{passive:true});
      el.addEventListener('touchmove',e=>tgLongPressMove(e,el),{passive:true});
      el.addEventListener('touchend',()=>clearTimeout(tgLP));
      el.addEventListener('mousedown',e=>tgLongPressStart(e,el));
      el.addEventListener('mouseup',()=>clearTimeout(tgLP));
      el.addEventListener('mousemove',()=>clearTimeout(tgLP));
      el.addEventListener('contextmenu',e=>e.preventDefault());
    });
  }
}

function tgLongPressMove(e,el){

function tgSongMenu(x,y,id){

  document.body.appendChild(menu);

  let left=Math.max(8,Math.min(x-mw/2,innerWidth-mw-8));
  let top=y-mh-16;if(top<8)top=y+24;if(top>innerHeight-mh-8)top=innerHeight-mh-8;
  menu.style.left=left+'px';menu.style.top=top+'px';

  document.addEventListener('pointerdown',closer);document.addEventListener('touchstart',closer);

async function tgDelSel(){

let _tfDragged=false;
function setupFloatDrag(el){
  if(!el||el.dataset.drag)return;el.dataset.drag=1;
  let sx=0,sy=0,ox=0,oy=0,moving=false;
  el.addEventListener('pointerdown',e=>{
    moving=false;el._moved=false;sx=e.clientX;sy=e.clientY;
    const r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;
    el.setPointerCapture?.(e.pointerId);
  });
  el.addEventListener('pointermove',e=>{
    if(!moving&&(Math.abs(e.clientX-sx)>4||Math.abs(e.clientY-sy)>4))moving=true;
    if(moving){
      el._moved=true;_tfDragged=true;
      let l=e.clientX-ox,t=e.clientY-oy;
      const er=el.getBoundingClientRect();
      l=Math.max(4,Math.min(l,window.innerWidth-er.width-4));
      t=Math.max(4,Math.min(t,window.innerHeight-er.height-4));
      el.style.left=l+'px';el.style.top=t+'px';el.style.transform='none';el.style.right='auto';el.style.bottom='auto';
    }
  });
  el.addEventListener('pointerup',()=>{moving=false;setTimeout(()=>_tfDragged=false,0);});
  el.addEventListener('click',e=>{if(el._moved){e.preventDefault();e.stopPropagation();el._moved=false;}},true);
}
function loadTogetherSong(song,auto){
  if(!audioEl){audioEl=new Audio();audioEl.addEventListener('ended',tgEnded);audioEl.addEventListener('play',tgSyncState);audioEl.addEventListener('pause',tgSyncState);}
  state.player.song=song;
  audioEl.src=musicSrc(song);
  if(auto){tryPlay();}
  else{audioEl.pause();audioEl.currentTime=0;}
  audioEl.ontimeupdate=()=>{
    const b1=$('#tgProg'),b2=$('#tfProg');
    if(b1){b1.max=audioEl.duration||100;b1.value=audioEl.currentTime;}if(b2){b2.max=audioEl.duration||100;b2.value=audioEl.currentTime;}
    const t1=$('#tgTime'),t2=$('#tfTime');const s=fmtDur(audioEl.currentTime);
    if(t1)t1.textContent=s;if(t2)t2.textContent=s;
    const d=audioEl.duration;
    if(d>0){const d1=$('#tgDur'),d2=$('#tfDur');const ds=fmtDur(d);if(d1&&d1.textContent!==ds)d1.textContent=ds;if(d2&&d2.textContent!==ds)d2.textContent=ds;}
  };
  audioEl.onloadedmetadata=()=>{const d1=$('#tgDur'),d2=$('#tfDur');const s=fmtDur(audioEl.duration);if(d1)d1.textContent=s;if(d2)d2.textContent=s;};
  tgSyncState();
}
function tgSeek(el){if(audioEl&&audioEl.duration){audioEl.currentTime=+el.value;}}
function tgSyncState(){
  const playing=audioEl&&!audioEl.paused;

async function tgToggle(){
